name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: webapp

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'webapp/tests/e2e/package-lock.json'

    - name: Start Docker Stack
      run: docker compose -f docker-compose.test.nocodb.yml up -d --build

    - name: Wait for API and DB Health
      run: |
        echo "Waiting for test-api to be healthy..."
        TIMEOUT=60
        while [ $TIMEOUT -gt 0 ]; do
          if [ "$(docker inspect -f '{{.State.Health.Status}}' bctest-api)" == "healthy" ]; then
            echo "bctest-api is healthy!"
            break
          fi
          echo "Waiting..."
          sleep 5
          TIMEOUT=$((TIMEOUT-5))
        done
        if [ $TIMEOUT -le 0 ]; then
          echo "Timeout waiting for API"
          docker compose -f docker-compose.test.nocodb.yml logs
          exit 1
        fi

    - name: Seed Test Data
      run: node scripts/seed-test-data.mjs --url=http://localhost:9080 --email=admin@bcauto.work --password=admin123

    - name: Install Playwright Dependencies
      working-directory: webapp/tests/e2e
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: webapp/tests/e2e
      run: npx playwright install --with-deps chromium

    - name: Run Playwright Tests
      working-directory: webapp/tests/e2e
      run: npx playwright test --workers=1

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: webapp/tests/e2e/playwright-report/
        retention-days: 14
