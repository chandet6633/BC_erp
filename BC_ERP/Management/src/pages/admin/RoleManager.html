<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Role Manager - BC Auto Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css" />
    <link rel="stylesheet" href="../../assets/css/page-header.css" />
    <link href="../../assets/css/style.css?v=3" rel="stylesheet" />
    <style>
        .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-5); margin-top: var(--space-4); }
        .role-card { background: white; border-radius: var(--radius-lg); padding: var(--space-5); border: 1px solid var(--surface-200); }
        .role-card h3 { font-size: var(--text-lg); font-weight: 700; text-transform: capitalize; margin-bottom: 4px; color: var(--surface-900); display: flex; align-items: center; gap: 8px; }
        .role-card .subtitle { font-size: var(--text-xs); color: var(--surface-500); margin-bottom: var(--space-4); }
        .tool-list { display: flex; flex-direction: column; gap: 6px; max-height: 400px; overflow-y: auto; padding-right: 4px; }
        .tool-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--surface-100); transition: all 0.2s ease; cursor: pointer; }
        .tool-item:hover { background: var(--surface-50); border-color: var(--surface-200); }
        .tool-info { flex: 1; }
        .tool-title { font-size: var(--text-sm); font-weight: 600; color: var(--surface-800); margin-bottom: 2px; }
        .tool-desc { font-size: 0.65rem; color: var(--surface-400); line-height: 1.3; }
        
        /* Modern Checkbox */
        .checkbox-wrapper { display: flex; align-items: center; justify-content: center; padding-top: 2px; }
        .checkbox-wrapper input { width: 18px; height: 18px; accent-color: var(--primary-600); cursor: pointer; }
        
        .loading-state { text-align: center; padding: 60px 20px; color: var(--surface-500); }
    </style>
    <link rel="stylesheet" href="../../assets/css/app-shell.css" />
</head>
<body class="page-bg">
    <div class="container" style="max-width: 1000px; padding: 20px;">
        <div class="page-header">
            <div>
                <h1 class="page-title"><span class="material-icons-outlined" style="font-size:1.6rem;vertical-align:bottom">security</span> จัดการสิทธิ์การเข้าถึง</h1>
                <p class="page-subtitle">กำหนดเครื่องมือที่อนุญาตสำหรับแต่ละ Role</p>
            </div>
            <div class="page-actions">
                <a href="index.html" class="page-back-btn">← กลับ</a>
            </div>
        </div>

        <div id="loading" class="loading-state">
            <span class="material-icons-outlined" style="font-size:2rem;animation:spin 1s linear infinite">refresh</span>
            <div style="margin-top:12px;font-size:var(--text-sm);font-weight:500">กำลังโหลดข้อมูล Roles...</div>
        </div>

        <div id="manager-content" style="display:none">
            <div class="role-grid" id="role-cards">
                <!-- Role cards will be injected here -->
            </div>

            <div style="text-align:center; margin-top: var(--space-6);">
                <button onclick="saveAllPermissions(event)" class="btn btn-primary" style="padding: 12px 32px; font-size: 1rem; font-weight: 700; box-shadow: var(--shadow-md);">
                    <span class="material-icons-outlined" style="font-size:1.2rem;vertical-align:text-bottom">save</span> บันทึกการตั้งค่าทั้งหมด
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { pb } from '../../services/pocketbase.js';
        import { AuthService } from '../../services/authService.js';
        import { TOOLS } from '../../registry.js';
        import { ConfigService } from '../../services/configService.js';
        import { AuditService } from '../../services/auditService.js';

        let ROLES = [];
        let rolePermissions = {};

        async function init() {
            if (!AuthService.requireRole(['admin', 'owner'])) return;

            try {
                // 1. Fetch dynamic roles from users table
                const users = await pb.collection('users').getFullList({ fields: 'role' });
                const uniqueRoles = new Set(users.map(u => u.role).filter(r => r && typeof r === 'string'));
                // Ensure at least admin is present
                uniqueRoles.add('admin');
                ROLES = Array.from(uniqueRoles).sort();

                await ConfigService.init();

                // 2. Prime rolePermissions with current state or defaults
                ROLES.forEach(role => {
                    const dbPerms = ConfigService.rolePermissions[role] || [];
                    const hasValid = dbPerms.some(dbId => TOOLS.some(t => t.id === dbId));

                    rolePermissions[role] = hasValid ? dbPerms :
                        TOOLS.filter(t => t.roles.includes(role)).map(t => t.id);
                });

                renderRoles();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('manager-content').style.display = 'block';
            } catch (err) {
                console.error("Initialization error:", err);
                document.getElementById('loading').innerHTML = `<div style="color:var(--danger)">เกิดข้อผิดพลาด: ${err.message}</div>`;
            }
        }

        function renderRoles() {
            const container = document.getElementById('role-cards');
            container.innerHTML = ROLES.map(role => {
                const safeRole = window.escHtml(role);
                return `
                <div class="role-card">
                    <h3><span class="material-icons-outlined" style="color:var(--primary-600);font-size:1.3rem">badge</span> ${role === 'sa' ? 'Service Advisor' : safeRole}</h3>
                    <p class="subtitle">สิทธิ์สำหรับกลุ่มผู้ใช้: ${safeRole}</p>
                    
                    <div class="tool-list">
                        ${TOOLS.map(tool => `
                            <label class="tool-item">
                                <div class="checkbox-wrapper">
                                    <input type="checkbox" 
                                           ${rolePermissions[role].includes(tool.id) ? 'checked' : ''} 
                                           onchange="togglePermission('${safeRole.replace(/'/g, "\\'")}', '${window.escHtml(tool.id)}', this.checked)">
                                </div>
                                <div class="tool-info">
                                    <div class="tool-title">${window.escHtml(tool.title)}</div>
                                    <div class="tool-desc">${window.escHtml(tool.description || tool.group || 'Utility Tool')}</div>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
            }).join('');
        }

        window.togglePermission = (role, toolId, isChecked) => {
            if (!rolePermissions[role]) rolePermissions[role] = [];

            if (isChecked) {
                if (!rolePermissions[role].includes(toolId)) {
                    rolePermissions[role].push(toolId);
                }
            } else {
                rolePermissions[role] = rolePermissions[role].filter(id => id !== toolId);
            }
        };

        window.saveAllPermissions = async (event) => {
            const btn = event ? event.currentTarget : document.querySelector('button.btn-primary');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-icons-outlined" style="font-size:1.2rem;animation:spin 1s linear infinite;vertical-align:text-bottom">refresh</span> กำลังบันทึก...';

            try {
                // Ensure system_roles is present or fallback to try/catch
                const promises = ROLES.map(async (role) => {
                    let record;
                    try {
                        // NocoDB adapter supports filter
                        record = await pb.collection('system_roles').getFirstListItem(`role_name='${role}'`);
                    } catch (e) {
                        // Not found, will create
                    }

                    const data = {
                        role_name: role,
                        name: role, // added because schema requires `name` or defaults it sometimes
                        allowed_tools: JSON.stringify(rolePermissions[role]) // Ensure we pass stringified json if field is generic string, NocoDB handles stringified arrays better
                    };

                    if (record) {
                        return pb.collection('system_roles').update(record.id, data);
                    } else {
                        return pb.collection('system_roles').create(data);
                    }
                });

                await Promise.all(promises);
                try { AuditService.log('permissions_update', `Updated role permissions for: ${ROLES.join(', ')}`, 'admin'); } catch {}
                await ConfigService.init(); // Reload configurations after saving
                
                btn.style.background = 'var(--success-600)';
                btn.innerHTML = '<span class="material-icons-outlined" style="font-size:1.2rem;vertical-align:text-bottom">check</span> บันทึกเรียบร้อย';
                setTimeout(() => {
                    btn.style.background = '';
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error(error);
                alert('Error saving permissions: ' + error.message);
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        };

        init();
    </script>
    <script type="module" src="../../assets/js/app-shell.js"></script>
</body>
</html>
