<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Logs - BC Auto Admin</title>
    <style>
        body {
            padding: var(--space-6);
            background: var(--surface-50);
        }

        .log-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .log-table th {
            background: var(--surface-100);
            padding: var(--space-3);
            text-align: left;
            font-size: var(--text-xs);
            text-transform: uppercase;
            color: var(--surface-600);
        }

        .log-table td {
            padding: var(--space-3);
            border-bottom: 1px solid var(--surface-200);
            font-size: var(--text-sm);
        }

        .log-table tr:hover {
            background: var(--surface-0);
        }

        .status-tag {
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
        }

        .role-admin {
            color: var(--primary-700);
            background: var(--primary-100);
        }

        .role-manager {
            color: var(--secondary-700);
            background: var(--secondary-100);
        }

        .role-employee {
            color: var(--surface-700);
            background: var(--surface-200);
        }
    </style>
    \n\n
  <script type="module" crossorigin src="../../assets/admin_audit-6rdAp9Ph.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/app-shell-DruINWZs.js">
  <link rel="modulepreload" crossorigin href="../../assets/authService-B7yCEaIZ.js">
  <link rel="modulepreload" crossorigin href="../../assets/helpers-DHRWRroM.js">
  <link rel="modulepreload" crossorigin href="../../assets/auditService-OL5IOGvx.js">
  <link rel="stylesheet" crossorigin href="../../assets/app-shell-C55UztRe.css">
  <link rel="stylesheet" crossorigin href="../../assets/design-system-BnpIurk9.css">
</head>

<body>
    <div class="container mx-auto">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold">Audit Logs</h1>
                <p class="text-sub">Tracking system activity and security events</p>
            </div>
            <div class="flex gap-2">
                <button class="btn btn-ghost" onclick="window.location.href='index.html'">⬅ Back</button>
                <button class="btn btn-primary" onclick="loadLogs()">🔄 Refresh</button>
            </div>
        </div>

        <div class="card p-0 overflow-hidden bg-white shadow-sm border border-surface-200">
            <div class="p-4 border-bottom flex gap-4 bg-surface-50">
                <input type="text" id="search-input" class="input flex-grow"
                    placeholder="Search by name or action..." />
                <select id="module-filter" class="input" style="width: 150px">
                    <option value="">All Modules</option>
                    <option value="auth">Auth</option>
                    <option value="system">System</option>
                    <option value="admin">Admin</option>
                    <option value="branch-operations">Branch Operations</option>
                    <option value="bcauto-service">Legacy (Service)</option>
                    <option value="bcauto-suphan">Legacy (Suphan)</option>
                </select>
            </div>
            <table class="log-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>User</th>
                        <th>Role</th>
                        <th>Action</th>
                        <th>Details</th>
                        <th>Module</th>
                        <th>Branch</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <tr>
                        <td colspan="7" class="text-center py-8">Loading logs...</td>
                    </tr>
                </tbody>
            </table>
            <div class="p-4 flex justify-between items-center bg-surface-50 border-top">
                <span id="log-count" class="text-xs text-sub">... logs found</span>
                <div class="flex gap-2">
                    <button class="btn btn-sm" id="prev-page">Prev</button>
                    <span id="page-num" class="text-sm font-medium">Page 1</span>
                    <button class="btn btn-sm" id="next-page">Next</button>
                </div>
            </div>
        </div>
    </div>

    \n\n
</body>

</html>
