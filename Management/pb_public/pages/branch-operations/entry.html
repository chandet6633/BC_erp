<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>บันทึกรายจ่าย - BC Auto Admin</title>
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="icon" type="image/x-icon" href="../../favicon.ico?v=7" />
    <link rel="apple-touch-icon" href="../../icons/icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        .expense-form-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--surface-100);
            margin-bottom: var(--space-6);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-4);
            margin-bottom: var(--space-4);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--space-1);
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--surface-700);
        }

        .expense-history {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--surface-100);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-4);
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .history-total {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border: 1px solid #fecaca;
            border-radius: var(--radius-lg);
            padding: var(--space-3) var(--space-4);
            text-align: center;
            margin-bottom: var(--space-4);
        }

        .history-total .label { font-size: var(--text-xs); color: #991b1b; font-weight: 600; }
        .history-total .value { font-size: 1.5rem; font-weight: 800; color: #dc2626; }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }

        @media (max-width: 640px) {
            .filter-row { grid-template-columns: 1fr 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }

        .expense-row {
            display: grid;
            grid-template-columns: 90px 1fr auto 100px auto;
            gap: var(--space-3);
            padding: var(--space-3);
            border-bottom: 1px solid var(--surface-100);
            align-items: center;
            font-size: var(--text-sm);
        }

        .expense-row:hover { background: var(--surface-50); }

        .expense-row .cat-badge {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
            background: var(--primary-50);
            color: var(--primary-700);
        }

        .expense-row .amount {
            font-weight: 700;
            color: #dc2626;
            text-align: right;
        }

        .expense-row .actions {
            display: flex;
            gap: var(--space-1);
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        .btn-icon.edit { background: var(--primary-50); color: var(--primary-600); }
        .btn-icon.edit:hover { background: var(--primary-100); }
        .btn-icon.delete { background: #fef2f2; color: #dc2626; }
        .btn-icon.delete:hover { background: #fee2e2; }

        .empty-state {
            text-align: center;
            padding: var(--space-8);
            color: var(--surface-400);
        }

        .empty-state .icon { font-size: 2.5rem; margin-bottom: var(--space-2); }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: var(--space-4);
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--surface-800);
        }

        .att-thumbs { display: flex; gap: 4px; flex-wrap: wrap; }
        .att-thumbs img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; border: 1px solid var(--surface-200); cursor: pointer; }
    </style>
  <script type="module" crossorigin src="../../assets/bc_ops_entry-HakXn6uM.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/app-shell-DruINWZs.js">
  <link rel="modulepreload" crossorigin href="../../assets/helpers-DHRWRroM.js">
  <link rel="modulepreload" crossorigin href="../../assets/ui-D6UlSK9g.js">
  <link rel="modulepreload" crossorigin href="../../assets/authService-B7yCEaIZ.js">
  <link rel="stylesheet" crossorigin href="../../assets/app-shell-C55UztRe.css">
  <link rel="stylesheet" crossorigin href="../../assets/design-system-BnpIurk9.css">
  <link rel="stylesheet" crossorigin href="../../assets/page-header-B6HlsY86.css">
  <link rel="stylesheet" crossorigin href="../../assets/style-DPwNr2Bh.css">
</head>

<body class="page-bg">
    <div class="container" style="max-width: 900px; padding: 20px; padding-bottom: var(--space-8);">
        <div class="page-header">
            <div>
                <h1 class="page-title"><span class="material-icons-outlined" style="font-size:1.6rem;vertical-align:bottom">receipt_long</span> บันทึกรายจ่าย</h1>
                <p class="page-subtitle">บันทึกค่าใช้จ่ายประจำวัน</p>
            </div>
            <div class="page-actions">
                <a href="../main/index.html" class="page-back-btn">← กลับ</a>
            </div>
        </div>

        <!-- Branch selector (admin/owner only) -->
        <div id="branchSelector" style="display:none; margin-bottom: var(--space-4);">
            <div class="card" style="padding: var(--space-3) var(--space-4); display: flex; align-items: center; gap: var(--space-3);">
                <span class="material-icons-outlined" style="color:var(--primary-600)">store</span>
                <label style="font-size:var(--text-sm);font-weight:600;white-space:nowrap">สาขา:</label>
                <select id="branchDropdown" class="input" style="flex:1;height:38px">
                    <option value="">เลือกสาขา</option>
                </select>
            </div>
        </div>

        <!-- Add Expense Form -->
        <div class="expense-form-card">
            <h3 class="section-title">
                <span class="material-icons-outlined" style="color:var(--primary-600)">add_circle</span>
                เพิ่มรายจ่าย
            </h3>
            <form id="expenseForm">
                <div class="form-row">
                    <div class="form-group">
                        <label><span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">calendar_today</span> วันที่</label>
                        <input type="date" id="expDate" class="input" required />
                    </div>
                    <div class="form-group">
                        <label><span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">category</span> หมวดหมู่</label>
                        <select id="expCategory" class="input" required>
                            <option value="">เลือกหมวดหมู่</option>
                            <option value="ค่าแรงช่าง">🔧 ค่าแรงช่าง</option>
                            <option value="ค่าไฟ">⚡ ค่าไฟ</option>
                            <option value="ค่าน้ำ">💧 ค่าน้ำ</option>
                            <option value="ค่าเช่า">🏠 ค่าเช่า</option>
                            <option value="ค่าอุปกรณ์">🛠️ ค่าอุปกรณ์</option>
                            <option value="ค่าขนส่ง">🚚 ค่าขนส่ง</option>
                            <option value="ค่าอาหาร">🍜 ค่าอาหาร</option>
                            <option value="ค่าซ่อมบำรุง">🏗️ ค่าซ่อมบำรุง</option>
                            <option value="ค่าประกัน">🛡️ ค่าประกัน</option>
                            <option value="ค่าโฆษณา">📣 ค่าโฆษณา</option>
                            <option value="เงินเดือน">💰 เงินเดือน</option>
                            <option value="เจ้าของเบิก">👤 เจ้าของเบิก</option>
                            <option value="อื่นๆ">📝 อื่นๆ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">payments</span> จำนวนเงิน (บาท)</label>
                        <input type="number" id="expAmount" class="input" step="0.01" min="0" placeholder="0.00" required />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">credit_card</span> ชำระโดย</label>
                        <select id="expPayment" class="input">
                            <option value="เงินสด">💵 เงินสด</option>
                            <option value="โอนจ่าย">📱 โอนจ่าย</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">notes</span> หมายเหตุ</label>
                        <input type="text" id="expNote" class="input" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)" />
                    </div>
                </div>

                <!-- Attachment Upload -->
                <div class="form-group" style="margin-bottom: var(--space-4);">
                    <label><span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">attach_file</span> แนบหลักฐาน (รูปภาพ)</label>
                    <div id="uploadZone"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; padding: var(--space-3); font-weight: 700;">
                    <span class="material-icons-outlined" style="font-size:1.1rem;vertical-align:text-bottom">save</span> บันทึกรายจ่าย
                </button>
            </form>
        </div>

        <!-- Expense History -->
        <div class="expense-history">
            <div class="history-header">
                <h3 class="section-title" style="margin-bottom:0">
                    <span class="material-icons-outlined" style="color:var(--primary-600)">history</span>
                    ประวัติรายจ่าย
                </h3>
                <button class="btn btn-outline btn-sm" id="refreshBtn">
                    <span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">refresh</span> รีเฟรช
                </button>
            </div>

            <div class="history-total">
                <div class="label">รวมรายจ่ายทั้งหมด (ตามตัวกรอง)</div>
                <div class="value" id="totalExpense">฿0</div>
            </div>

            <div class="filter-row">
                <select id="filterCategory" class="input" style="height: 40px;">
                    <option value="">ทุกหมวดหมู่</option>
                </select>
                <input type="date" id="filterFrom" class="input" style="height: 40px;" />
                <input type="date" id="filterTo" class="input" style="height: 40px;" />
                <button class="btn btn-ghost" id="clearFilter" style="height: 40px;">ล้าง</button>
            </div>

            <div id="expenseList">
                <div class="empty-state">
                    <div class="icon"><span class="material-icons-outlined" style="font-size:2.5rem">inbox</span></div>
                    <p>ยังไม่มีรายจ่าย</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="card" style="max-width: 500px; width: 90%; margin: auto; padding: var(--space-6);">
            <h3 style="margin-bottom: var(--space-4); display: flex; align-items: center; gap: 8px;">
                <span class="material-icons-outlined" style="color:var(--primary-600)">edit</span> แก้ไขรายการ
            </h3>
            <div id="editFields" style="margin-bottom: var(--space-4);"></div>
            <div style="display: flex; gap: var(--space-2); justify-content: flex-end;">
                <button class="btn btn-ghost" id="cancelEditBtn">ยกเลิก</button>
                <button class="btn btn-primary" id="saveEditBtn">บันทึก</button>
            </div>
        </div>
    </div>

</body>
</html>
