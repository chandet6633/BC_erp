<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>แจ้งลางาน | Bancha HR</title>
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <style>
        :root {
            --leave-primary: #b91c1c;
            --leave-gradient: linear-gradient(135deg, #ef4444 0%, #b91c1c 50%, #7f1d1d 100%);
        }
        body {
            background: var(--surface-50);
            background-image: radial-gradient(circle at 20% 80%, rgba(185, 28, 28, 0.04) 0%, transparent 50%);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            padding: 1rem;
        }
        .page-container {
            max-width: 520px;
            margin: 0 auto;
        }
        .back-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .back-link {
            color: var(--surface-500);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .leave-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-5);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--space-4);
        }
        .form-title {
            text-align: center;
            color: var(--leave-primary);
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: var(--space-4);
        }
        .field-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--surface-500);
            margin-bottom: 0.25rem;
        }
        .field-input, .field-select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--surface-200);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            margin-bottom: 1rem;
            background: var(--surface-50);
        }
        .field-input:focus, .field-select:focus {
            border-color: var(--leave-primary);
            outline: none;
            background: white;
        }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--leave-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
            display: none;
        }
        .loading-overlay.active { display: flex; }
    </style>
    
  <script type="module" crossorigin src="../../assets/hr_leave-DW-r0NbY.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/app-shell-DruINWZs.js">
  <link rel="modulepreload" crossorigin href="../../assets/helpers-DHRWRroM.js">
  <link rel="modulepreload" crossorigin href="../../assets/authService-B7yCEaIZ.js">
  <link rel="stylesheet" crossorigin href="../../assets/app-shell-C55UztRe.css">
  <link rel="stylesheet" crossorigin href="../../assets/design-system-BnpIurk9.css">
  <link rel="stylesheet" crossorigin href="../../assets/glass-ui-BB2-B0XT.css">
</head>
<body>
    <div class="toast-stack" id="toastStack"></div>
    <div class="loading-overlay" id="loadingOverlay">
        <span class="spinner" style="display:inline-block; border: 3px solid var(--surface-200); border-right-color: var(--leave-primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;"></span>
    </div>

    <div class="page-container">
        <div class="back-row">
            <a href="index.html" class="back-link">← เมนู HR</a>
        </div>

        <div class="leave-card">
            <div class="form-title">
                <span class="material-icons-outlined" style="vertical-align:bottom">edit_document</span> 
                แบบฟอร์มแจ้งลางาน
            </div>

            <form id="leaveForm">
                <label class="field-label">พนักงาน</label>
                <select class="field-select" id="empSelect" required>
                    <option value="">– กำลังโหลดข้อมูล –</option>
                </select>

                <label class="field-label">ประเภทการลา</label>
                <select class="field-select" id="typeSelect" required>
                    <option value="sick">ลาป่วย</option>
                    <option value="personal">ลากิจ</option>
                    <option value="vacation">ลาพักร้อน</option>
                    <option value="other">อื่นๆ</option>
                </select>

                <div style="display:flex; gap:1rem;">
                    <div style="flex:1">
                        <label class="field-label">ตั้งแต่วันที่</label>
                        <input type="date" class="field-input" id="startDate" required />
                    </div>
                    <div style="flex:1">
                        <label class="field-label">ถึงวันที่</label>
                        <input type="date" class="field-input" id="endDate" required />
                    </div>
                </div>

                <label class="field-label">เหตุผลการลา</label>
                <textarea class="field-input" id="reasonInput" rows="3" placeholder="ระบุเหตุผลการลา..." required></textarea>

                <button type="submit" class="btn-submit" id="submitBtn">ส่งใบลา</button>
            </form>
        </div>
    </div>

</body>
</html>
