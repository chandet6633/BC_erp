    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 30%, #dbeafe 60%, #eff6ff 100%);
        }

        /* ===== MENU GRID ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 24px;
            align-content: start;
            align-items: start;
        }

        .menu-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .menu-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 40px -12px rgba(59, 130, 246, 0.15), 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        .menu-card:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .menu-card .icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 1.75rem;
        }

        .menu-card .title {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .menu-card .desc {
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.5;
        }

        /* ===== AUTH MODAL (Full-screen overlay) ===== */
        #auth-modal {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #1e3a5f 0%, #1e40af 40%, #3b82f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        #auth-modal.hidden {
            display: none !important;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .auth-logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
            padding: 12px;
        }

        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .auth-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: white;
            margin-bottom: 4px;
            letter-spacing: -0.025em;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 32px;
        }

        /* ===== ROLE CARDS GRID ===== */
        .role-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 28px 16px 24px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .role-card:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.3);
        }

        .role-card:active {
            transform: translateY(0) scale(0.97);
        }

        .role-card:focus {
            outline: 2px solid white;
            outline-offset: 3px;
            border-radius: 20px;
        }

        .role-card-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .role-card-icon svg {
            width: 28px;
            height: 28px;
        }

        .role-card-icon.blue {
            background: rgba(59, 130, 246, 0.3);
            color: white;
        }

        .role-card-icon.green {
            background: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .role-card-icon.amber {
            background: rgba(245, 158, 11, 0.3);
            color: #fcd34d;
        }

        .role-card-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: white;
            line-height: 1.3;
        }

        .role-card-sub {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: -4px;
        }

        @media (max-width: 480px) {
            .role-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                max-width: 280px;
                margin: 0 auto;
            }

            .role-card {
                flex-direction: row;
                padding: 16px 20px;
                text-align: left;
            }

            .role-card-icon {
                width: 44px;
                height: 44px;
            }
        }

        /* ===== PIN POPUP OVERLAY ===== */
        .pin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .pin-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .pin-popup {
            background: white;
            border-radius: 24px;
            padding: 32px 28px 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.3);
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pin-popup-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .pin-popup-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin-popup-icon svg {
            width: 22px;
            height: 22px;
        }

        .pin-popup-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .pin-popup-sub {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 16px;
        }

        .pin-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 16px 0;
        }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e2e8f0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pin-dot.active {
            background: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            transform: scale(1.15);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 240px;
            margin: 12px auto 0;
        }

        .num-btn {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
        }

        .num-btn:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .num-btn:active {
            transform: scale(0.95);
            background: #dbeafe;
        }

        .num-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .num-btn-clear {
            color: #ef4444;
            background: #fef2f2;
            border-color: #fecaca;
        }

        .num-btn-clear:hover {
            background: #fee2e2;
        }

        .num-btn-ok {
            color: white;
            background: linear-gradient(135deg, #1e40af, #2563eb);
            border: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .num-btn-ok:hover {
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .auth-error-msg {
            color: #dc2626;
            font-size: 0.78rem;
            margin-top: 8px;
            padding: 8px 12px;
            background: #fef2f2;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        .auth-error-msg.hidden {
            display: none;
        }

        .pin-back-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .pin-back-btn:hover {
            background: #f1f5f9;
            color: #334155;
        }

        .pin-back-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        /* ===== BRANCH SWITCHER ===== */
        .branch-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .branch-btn {
            padding: 12px 20px;
            border-radius: 14px;
            border: 2px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .branch-btn:hover {
            border-color: #93c5fd;
            background: white;
        }

        .branch-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .branch-btn.active {
            border-color: #2563eb;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            color: #1e40af;
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.12);
        }

        .branch-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ===== HEADER BAR ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .app-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
        }

        .logout-btn {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn:hover {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #dc2626;
        }

        .logout-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .logout-btn svg {
            width: 16px;
            height: 16px;
        }

        .branch-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* Animation helper */
        .animate-slide-up {
            animation: cardSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

<body>
    <!-- Auth Modal (Full-Screen Login) -->
    <div id="auth-modal" class="hidden">
        <div class="auth-container">
            <!-- Logo -->
            <div class="auth-logo">
                <img src="../../logo-app.png?v=7" alt="BC Auto Logo" />
            </div>
            <h1 class="auth-title">
                BC AUTO XPERIENCE
            </h1>
            <p class="auth-subtitle">เลือกประเภทผู้ใช้งานเพื่อเข้าสู่ระบบ</p>

            <!-- Role Cards Grid -->
            <div class="role-grid">
                <button onclick="selectRole('manager')" class="role-card" aria-label="เข้าสู่ระบบผู้จัดการ">
                    <div class="role-card-icon blue">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 7h-9" />
                            <path d="M14 17H5" />
                            <circle cx="17" cy="17" r="3" />
                            <circle cx="7" cy="7" r="3" />
                        </svg>
                    </div>
                    <span class="role-card-label">ผู้จัดการ</span>
                    <span class="role-card-sub">Manager</span>
                </button>

                <button onclick="selectRole('sa')" class="role-card" aria-label="เข้าสู่ระบบ SA">
                    <div class="role-card-icon green">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                        </svg>
                    </div>
                    <span class="role-card-label">SA</span>
                    <span class="role-card-sub">Service Advisor</span>
                </button>

                <button onclick="selectRole('mechanic')" class="role-card" aria-label="เข้าสู่ระบบช่าง">
                    <div class="role-card-icon" style="background: rgba(234, 88, 12, 0.3); color: #fdba74;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                        </svg>
                    </div>
                    <span class="role-card-label">ช่าง</span>
                    <span class="role-card-sub">Mechanic</span>
                </button>

                <button onclick="selectRole('admin')" class="role-card" aria-label="เข้าสู่ระบบ Admin">
                    <div class="role-card-icon amber">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </div>
                    <span class="role-card-label">Admin</span>
                    <span class="role-card-sub">ผู้ดูแลระบบ</span>
                </button>
            </div>
        </div>
    </div>

    <!-- PIN Popup Overlay (appears on top when role is clicked) -->
    <div id="pin-overlay" class="pin-overlay" onclick="if(event.target===this) closePinPopup()">
        <div class="pin-popup">
            <div class="pin-popup-header">
                <div class="pin-popup-icon" id="pin-popup-icon"></div>
                <span class="pin-popup-title" id="pin-instr"></span>
            </div>
            <p class="pin-popup-sub">กรุณาใส่รหัส PIN เพื่อเข้าใช้งาน</p>
            <div class="pin-display">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
            <div class="numpad">
                <button class="num-btn" onclick="pressKey('1')">1</button>
                <button class="num-btn" onclick="pressKey('2')">2</button>
                <button class="num-btn" onclick="pressKey('3')">3</button>
                <button class="num-btn" onclick="pressKey('4')">4</button>
                <button class="num-btn" onclick="pressKey('5')">5</button>
                <button class="num-btn" onclick="pressKey('6')">6</button>
                <button class="num-btn" onclick="pressKey('7')">7</button>
                <button class="num-btn" onclick="pressKey('8')">8</button>
                <button class="num-btn" onclick="pressKey('9')">9</button>
                <button class="num-btn num-btn-clear" onclick="clearPIN()">C</button>
                <button class="num-btn" onclick="pressKey('0')">0</button>
                <button class="num-btn num-btn-ok" onclick="submitAuth()">OK</button>
            </div>
            <p id="auth-error" class="auth-error-msg hidden"></p>
            <button onclick="closePinPopup()" class="pin-back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="display:inline;vertical-align:middle;margin-right:4px">
                    <path d="m12 19-7-7 7-7" />
                    <path d="M19 12H5" />
                </svg>
                กลับไปเลือกประเภทผู้ใช้งาน
            </button>
        </div>
    </div>

    <main class="container py-8"
        style="max-width:1100px; margin:0 auto; padding:32px 20px; min-height: 85vh; display: flex; flex-direction: column;">
        <!-- The Global AppShell handles the Topbar, Branch Switcher, and User Actions now -->


        <div id="tool-grid" class="menu-grid" style="flex: 1;">
            <!-- Tools will be rendered here -->
        </div>

        <footer
            style="text-align: center; margin-top: 40px; padding-top: 20px; color: var(--surface-400); font-size: var(--text-xs); border-top: 1px solid var(--surface-200);">
            v1.1.0 &bull; Refined Utility Design
        </footer>
    </main>


    <!-- Execute App Shell Layout Renderer -->
</body>
