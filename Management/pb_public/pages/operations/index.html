    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 30%, #dbeafe 60%, #eff6ff 100%);
            margin: 0;
        }

        /* ===== MENU GRID ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 24px;
            align-content: start;
            align-items: start;
        }

        .menu-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .menu-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 40px -12px rgba(59, 130, 246, 0.15), 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        .menu-card .icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 1.75rem;
        }

        .menu-card .title {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .menu-card .desc {
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.5;
        }

        /* Animation helper */
        .animate-slide-up {
            animation: cardSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
