<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backup & Export - BC Auto Admin</title>
    <link rel="stylesheet" href="../../assets/css/design-system.css" />
    <style>
        body {
            padding: var(--space-6);
            background: var(--surface-50);
        }

        .action-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-6);
            background: white;
            border: 1px solid var(--surface-200);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-4);
        }
    </style>
\n    <link rel="stylesheet" href="../../assets/css/app-shell.css" />\n</head>

<body>
    <div class="container mx-auto max-w-2xl">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold">Backup & Export Center</h1>
                <p class="text-sub">Ensure data safety and generate master reports</p>
            </div>
            <button class="btn btn-ghost" onclick="window.location.href='index.html'">⬅ Back</button>
        </div>

        <!-- Database Backup -->
        <div class="action-card shadow-sm">
            <div>
                <h3 class="font-bold text-lg">Database Backup</h3>
                <p class="text-sm text-sub">Trigger a snapshot of the PocketBase database</p>
            </div>
            <button class="btn btn-primary" id="btn-backup">Run Backup</button>
        </div>



        <div id="status-box"
            class="mt-8 hidden p-4 rounded-lg bg-surface-100 text-sm font-mono border border-surface-200">
            ...
        </div>
    </div>

    <script type="module">
        import { AuthService } from '../../services/authService.js';
        import { AuditService } from '../../services/auditService.js';

        import { pb } from '../../services/pocketbase.js';

        // Security Gate
        if (!AuthService.hasRole(['admin', 'manager', 'owner'])) {
            AuthService.requireRole(['admin', 'manager', 'owner']);
        }

        const btnBackup = document.getElementById('btn-backup');
        const statusBox = document.getElementById('status-box');

        function showStatus(text, type = 'info') {
            statusBox.classList.remove('hidden');
            statusBox.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            statusBox.className = `mt-8 p-4 rounded-lg bg-${type}-50 text-${type}-700 text-sm font-mono border border-${type}-200`;
        }

        btnBackup.onclick = async () => {
            showStatus('Initiating backup process. Fetching data...');
            btnBackup.disabled = true;
            try {
                const collections = ['users', 'branches', 'hr_attendance', 'hr_leaves', 'bc_records', 'audit_logs'];
                const backupData = {};

                for (const col of collections) {
                    try {
                        const records = await pb.collection(col).getFullList();
                        backupData[col] = records;
                        showStatus(`Fetched ${records.length} records from ${col}...`);
                    } catch (e) {
                        console.warn(`Could not fetch ${col}:`, e);
                        backupData[col] = { error: e.message };
                    }
                }

                showStatus('Generating JSON file...');
                const jsonStr = JSON.stringify(backupData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const dateStr = new Date().toISOString().split('T')[0];
                const a = document.createElement('a');
                a.href = url;
                a.download = `bcauto_backup_${dateStr}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                await AuditService.log('db_backup', 'Database backup downloaded as JSON', 'admin');
                showStatus('Backup downloaded successfully.', 'success');
            } catch (error) {
                showStatus(`Backup failed: ${error.message}`, 'danger');
                await AuditService.log('db_backup_error', error.message, 'admin');
            } finally {
                btnBackup.disabled = false;
            }
        };
    </script>
\n    <script type="module" src="../../assets/js/app-shell.js"></script>\n</body>

</html>
