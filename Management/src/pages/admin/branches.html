<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branch Management - BC Auto Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css" />
    <link rel="stylesheet" href="../../assets/css/page-header.css" />
    <link href="../../assets/css/style.css?v=3" rel="stylesheet" />
    <style>
        .branch-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
        .branch-table th { text-align: left; padding: var(--space-3); border-bottom: 2px solid var(--surface-200); color: var(--surface-600); font-weight: 600; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; }
        .branch-table td { padding: var(--space-3); border-bottom: 1px solid var(--surface-100); }
        .branch-table tr:hover td { background: var(--surface-50); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: flex !important; }
        .modal-box { background: white; border-radius: 20px; padding: 28px; width: 100%; max-width: 480px; box-shadow: 0 32px 64px -12px rgba(0,0,0,0.2); animation: popIn 0.3s ease; }
        @keyframes popIn { from { opacity:0; transform: translateY(20px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: var(--text-sm); font-weight: 600; color: var(--surface-700); margin-bottom: 4px; }
        .form-group .input { width: 100%; }
        .emp-count { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-100); padding: 2px 10px; border-radius: 99px; font-size: var(--text-xs); font-weight: 600; color: var(--surface-600); }
    </style>
    <link rel="stylesheet" href="../../assets/css/app-shell.css" />
</head>
<body class="page-bg">
    <div class="container" style="max-width: 900px; padding: 20px;">
        <div class="page-header">
            <div>
                <h1 class="page-title"><span class="material-icons-outlined" style="font-size:1.6rem;vertical-align:bottom">store</span> จัดการสาขา</h1>
                <p class="page-subtitle">เพิ่ม แก้ไข ลบ สาขาของ Bancha Group</p>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary btn-sm" id="addBranchBtn"><span class="material-icons-outlined" style="font-size:1rem;vertical-align:text-bottom">add</span> เพิ่มสาขา</button>
                <a href="index.html" class="page-back-btn">← กลับ</a>
            </div>
        </div>

        <div class="card p-0" style="overflow: hidden; border: 1px solid var(--surface-200);">
            <div style="overflow-x: auto;">
                <table class="branch-table">
                    <thead><tr><th>ชื่อสาขา</th><th>สถานที่</th><th>เบอร์โทร</th><th>📍 GPS</th><th>พนักงาน</th><th>สถานะ</th><th style="text-align:center">จัดการ</th></tr></thead>
                    <tbody id="branch-body"><tr><td colspan="7" style="text-align:center;padding:40px;">กำลังโหลด...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="branchModal">
        <div class="modal-box">
            <h3 style="margin-bottom:20px;font-size:1.1rem;font-weight:700" id="modalTitle"><span class="material-icons-outlined" style="vertical-align:bottom">add_business</span> เพิ่มสาขาใหม่</h3>
            <form id="branchForm">
                <div class="form-group"><label>ชื่อสาขา *</label><input type="text" id="bName" class="input" placeholder="เช่น BC Auto เมืองสุพรรณ" required /></div>
                <div class="form-group"><label>สถานที่ / ที่อยู่</label><input type="text" id="bLocation" class="input" placeholder="เช่น 123 ถ.สุพรรณ" /></div>
                <div class="form-group"><label>เบอร์โทรศัพท์</label><input type="text" id="bPhone" class="input" placeholder="เช่น 035-123456" /></div>
                
                <div style="border-top:1px solid var(--surface-200);padding-top:14px;margin-top:14px">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                        <label style="font-size:var(--text-sm);font-weight:600;color:var(--surface-700);display:flex;align-items:center;gap:6px">
                            <span class="material-icons-outlined" style="font-size:1rem;color:#15803d">location_on</span> GPS สำหรับลงเวลา
                        </label>
                        <button type="button" class="btn btn-sm btn-outline" id="getGpsBtn" style="font-size:0.7rem;padding:3px 10px">
                            <span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">my_location</span> ใช้ตำแหน่งปัจจุบัน
                        </button>
                    </div>
                    <div style="display:flex;gap:10px">
                        <div style="flex:1">
                            <label style="font-size:var(--text-xs);color:var(--surface-500)">Latitude</label>
                            <input type="text" id="bLat" class="input" placeholder="เช่น 14.8821" style="font-family:monospace" />
                        </div>
                        <div style="flex:1">
                            <label style="font-size:var(--text-xs);color:var(--surface-500)">Longitude</label>
                            <input type="text" id="bLng" class="input" placeholder="เช่น 100.1278" style="font-family:monospace" />
                        </div>
                    </div>
                    <div style="font-size:0.65rem;color:var(--surface-400);margin-top:4px">* ใช้สำหรับตรวจสอบว่าพนักงานลงเวลาจากตำแหน่งที่ถูกต้อง (รัศมี 500m)</div>
                </div>

                <input type="hidden" id="bEditId" value="" />
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
                    <button type="button" class="btn btn-outline btn-sm" id="cancelBtn">ยกเลิก</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="saveBtn">💾 บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { pb } from '../../services/pocketbase.js';
        import { AuthService } from '../../services/authService.js';
        import { AuditService } from '../../services/auditService.js';

        if (!AuthService.hasRole(['admin', 'manager', 'owner'])) {
            AuthService.requireRole(['admin', 'manager', 'owner']);
        }

        let allUsers = [];

        // NocoDB may return Title-case or lowercase fields. This helper handles both.
        function f(record, key) {
            // Try: lowercase, Title-case, UPPERCASE
            return record[key] ?? record[key.charAt(0).toUpperCase() + key.slice(1)] ?? record[key.toUpperCase()] ?? '';
        }

        async function loadBranches() {
            const body = document.getElementById('branch-body');
            try {
                const [branches, users] = await Promise.all([
                    pb.collection('branches').getFullList(),
                    pb.collection('users').getFullList()
                ]);
                allUsers = users;

                console.log('Branch records sample:', branches[0]);

                if (branches.length === 0) {
                    body.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px">ยังไม่มีสาขา</td></tr>';
                    return;
                }

                body.innerHTML = branches.map(b => {
                    const branchName = f(b, 'name') || f(b, 'title') || '-';
                    const branchLocation = f(b, 'location') || f(b, 'address') || '-';
                    const branchPhone = f(b, 'phone') || f(b, 'tel') || '-';
                    const lat = f(b, 'latitude') || f(b, 'lat') || '';
                    const lng = f(b, 'longitude') || f(b, 'lng') || '';
                    const hasGps = lat && lng;
                    const isActive = (f(b, 'active') !== false && f(b, 'active') !== 'false');

                    // Case-insensitive matching for employee count
                    const branchLower = branchName.toLowerCase().trim();
                    const empCount = users.filter(u => {
                        const ub = (u.branch || u.Branch || '').toLowerCase().trim();
                        return ub === branchLower;
                    }).length;

                    return `<tr>
                        <td style="font-weight:600">${branchName}</td>
                        <td style="color:var(--surface-500);font-size:var(--text-sm)">${branchLocation}</td>
                        <td>${branchPhone}</td>
                        <td>${hasGps ? `<span style="font-family:monospace;font-size:0.7rem;color:var(--success-600)" title="${lat}, ${lng}"><span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">location_on</span> ตั้งแล้ว</span>` : '<span style="color:var(--surface-400);font-size:var(--text-xs)">ยังไม่ตั้ง</span>'}</td>
                        <td><span class="emp-count"><span class="material-icons-outlined" style="font-size:14px">person</span> ${empCount}</span></td>
                        <td><span style="color:${isActive?'var(--success-600)':'var(--danger)'};font-weight:600;font-size:var(--text-xs)">${isActive?'เปิดใช้':'ปิด'}</span></td>
                        <td style="text-align:center">
                            <button class="btn btn-sm btn-outline" onclick="editBranch('${b.id}')" style="font-size:0.75rem;padding:4px 8px">✏️</button>
                            <button class="btn btn-sm btn-outline" onclick="deleteBranch('${b.id}','${branchName.replace(/'/g,"\\'")}',${empCount})" style="font-size:0.75rem;padding:4px 8px;color:var(--danger)">🗑️</button>
                        </td>
                    </tr>`;
                }).join('');
            } catch (e) {
                console.error(e);
                body.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--danger)">Error: ${e.message}</td></tr>`;
            }
        }

        const modal = document.getElementById('branchModal');
        const form = document.getElementById('branchForm');

        document.getElementById('addBranchBtn').addEventListener('click', () => {
            document.getElementById('modalTitle').innerHTML = '<span class="material-icons-outlined" style="vertical-align:bottom">add_business</span> เพิ่มสาขาใหม่';
            form.reset();
            document.getElementById('bEditId').value = '';
            modal.classList.add('active');
        });
        document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('active'); });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'กำลังบันทึก...';
            
            const editId = document.getElementById('bEditId').value;
            const nameVal = document.getElementById('bName').value.trim();
            const locVal = document.getElementById('bLocation').value.trim();
            const phoneVal = document.getElementById('bPhone').value.trim();
            const latVal = document.getElementById('bLat').value.trim();
            const lngVal = document.getElementById('bLng').value.trim();
            
            // Match NocoDB schema precisely to avoid 400 Bad Request
            const data = {
                name: nameVal,
                address: locVal,
                phone: phoneVal,
                latitude: latVal,
                longitude: lngVal,
                is_active: true
            };
            
            console.log('Saving branch data:', data);
            
            try {
                if (editId) {
                    await pb.collection('branches').update(editId, data);
                } else {
                    await pb.collection('branches').create(data);
                }
                try { AuditService.log('branch_saved', `Branch: ${nameVal}`, 'admin'); } catch {}
                modal.classList.remove('active');
                loadBranches();
            } catch (err) {
                console.error('Branch save error:', err);
                alert('Error: ' + (err.message || JSON.stringify(err)));
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 บันทึก';
            }
        });

        window.editBranch = async (id) => {
            try {
                const b = await pb.collection('branches').getOne(id);
                document.getElementById('modalTitle').innerHTML = '<span class="material-icons-outlined" style="vertical-align:bottom">edit</span> แก้ไขสาขา';
                document.getElementById('bEditId').value = id;
                document.getElementById('bName').value = f(b, 'name') || f(b, 'title') || '';
                document.getElementById('bLocation').value = f(b, 'location') || f(b, 'address') || '';
                document.getElementById('bPhone').value = f(b, 'phone') || f(b, 'tel') || '';
                document.getElementById('bLat').value = f(b, 'latitude') || f(b, 'lat') || '';
                document.getElementById('bLng').value = f(b, 'longitude') || f(b, 'lng') || '';
                modal.classList.add('active');
            } catch (e) { alert('Error: ' + e.message); }
        };

        // Get current GPS button
        document.getElementById('getGpsBtn').addEventListener('click', () => {
            if (!navigator.geolocation) { alert('Browser does not support geolocation'); return; }
            const btn = document.getElementById('getGpsBtn');
            btn.disabled = true;
            btn.textContent = 'กำลังค้นหา...';
            navigator.geolocation.getCurrentPosition(
                pos => {
                    document.getElementById('bLat').value = pos.coords.latitude.toFixed(6);
                    document.getElementById('bLng').value = pos.coords.longitude.toFixed(6);
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">my_location</span> ใช้ตำแหน่งปัจจุบัน';
                },
                err => {
                    alert('ไม่สามารถระบุตำแหน่งได้: ' + err.message);
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-icons-outlined" style="font-size:0.9rem;vertical-align:text-bottom">my_location</span> ใช้ตำแหน่งปัจจุบัน';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });

        window.deleteBranch = async (id, name, empCount) => {
            if (empCount > 0) {
                alert(`ไม่สามารถลบสาขา "${name}" ได้ เนื่องจากยังมีพนักงาน ${empCount} คนอยู่ในสาขานี้`);
                return;
            }
            if (!confirm(`ต้องการลบสาขา "${name}" จริงหรือไม่?`)) return;
            try {
                await pb.collection('branches').delete(id);
                AuditService.log('branch_deleted', `Deleted branch: ${name}`, 'admin');
                loadBranches();
            } catch (e) { alert('Error: ' + e.message); }
        };

        loadBranches();
    </script>
    <script type="module" src="../../assets/js/app-shell.js"></script>
</body>
</html>
