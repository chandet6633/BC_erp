<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>ลงเวลาเข้า-ออก | Bancha HR</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=7" />

    <link rel="stylesheet" href="../../assets/css/design-system.css" />
    <link rel="stylesheet" href="../../assets/css/glass-ui.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        :root {
            --checkin-primary: #1565C0;
            --checkin-gradient: linear-gradient(135deg, #1976D2 0%, #1565C0 50%, #0D47A1 100%);
            --checkin-success: #38A169;
            --checkin-warning: #DD6B20;
            --checkin-error: #E53E3E;
        }

        body {
            background: var(--surface-50);
            background-image:
                radial-gradient(circle at 20% 80%, rgba(21, 101, 192, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(56, 161, 105, 0.06) 0%, transparent 50%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 1rem;
        }

        .page-container {
            max-width: 520px;
            margin: 0 auto;
        }

        .back-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .back-link {
            color: var(--surface-500);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--checkin-primary); }

        /* Clock hero */
        .clock-hero {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .clock-hero h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--checkin-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .live-clock {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 2rem;
            font-weight: 600;
            color: var(--checkin-primary);
            font-feature-settings: "tnum";
            padding: 0.5rem 1.25rem;
            background: linear-gradient(135deg, rgba(21,101,192,0.1) 0%, rgba(21,101,192,0.04) 100%);
            border-radius: 12px;
        }

        .live-date {
            color: var(--surface-500);
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        /* Card */
        .checkin-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 1.75rem;
            border: 1px solid rgba(255,255,255,0.8);
            margin-bottom: 1rem;
            position: relative;
        }

        .checkin-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 45px rgba(0,0,0,0.12);
        }

        /* Status dot */
        .status-indicator {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            color: var(--surface-400);
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #CBD5E0;
        }

        .status-dot.loading {
            background: var(--checkin-warning);
            animation: pulse 1.5s infinite;
        }

        .status-dot.ready { background: var(--checkin-success); }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* Form fields */
        .field-label {
            display: block;
            text-align: left;
            margin-top: 1.25rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--surface-600);
            margin-bottom: 0.4rem;
        }

        .field-label:first-of-type { margin-top: 0; }

        .field-select {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            border: 2px solid var(--surface-200);
            border-radius: 10px;
            background: var(--surface-50);
            color: var(--surface-900);
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%234A5568" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.25em;
            padding-right: 2.5rem;
            transition: all 0.25s;
        }

        .field-select:focus {
            outline: none;
            border-color: var(--checkin-primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(21,101,192,0.1);
        }

        .field-select:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            background-color: var(--surface-100);
        }

        .field-select.loading-state {
            border-color: var(--checkin-warning);
            background-color: #FFFAF0;
        }

        /* Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.75rem;
        }

        .btn-punch {
            position: relative;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
        }

        .btn-punch::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-punch:hover:not(:disabled)::before { opacity: 1; }

        .btn-punch:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .btn-punch:active:not(:disabled) { transform: translateY(0); }

        .btn-punch:disabled {
            background: linear-gradient(135deg, #A0AEC0, #718096) !important;
            cursor: not-allowed;
            transform: none;
        }

        .btn-punch.submitting { pointer-events: none; }

        .btn-in {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 4px 15px rgba(34,197,94,0.3);
        }

        .btn-out {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 15px rgba(239,68,68,0.3);
        }

        .btn-punch .spinner {
            display: none;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-punch.submitting .spinner { display: inline-block; }
        .btn-punch.submitting .btn-label { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Admin panel */
        .admin-toggle {
            margin-top: 1.25rem;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            font-family: inherit;
            background: transparent;
            color: var(--surface-400);
            border: 1.5px solid var(--surface-200);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s;
        }

        .admin-toggle:hover {
            border-color: var(--checkin-primary);
            color: var(--checkin-primary);
            background: rgba(21,101,192,0.04);
        }

        .admin-toggle.active {
            background: linear-gradient(135deg, var(--checkin-warning), #ED8936);
            color: white;
            border-color: var(--checkin-warning);
        }

        .admin-bar {
            display: none;
            background: linear-gradient(135deg, var(--checkin-warning), #ED8936);
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            font-weight: 600;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease;
        }

        .admin-bar.show { display: block; }

        .admin-fields {
            display: none;
            margin-top: 1.25rem;
            padding: 1rem;
            background: linear-gradient(135deg, #FFFAF0, #FFF5EB);
            border: 2px solid rgba(221,107,32,0.2);
            border-radius: 10px;
            animation: slideDown 0.3s ease;
        }

        .admin-fields.show { display: block; }

        .admin-fields-title {
            font-weight: 600;
            color: var(--checkin-warning);
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
        }

        .admin-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .field-input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            font-size: 0.9rem;
            font-family: inherit;
            border: 2px solid var(--surface-200);
            border-radius: 8px;
            background: #fff;
            transition: all 0.25s;
        }

        .field-input:focus {
            outline: none;
            border-color: var(--checkin-primary);
            box-shadow: 0 0 0 3px rgba(21,101,192,0.1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tabs */
        .tab-row {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
        }

        .tab-btn {
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--surface-500);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-100, rgba(21,101,192,0.1));
            color: var(--checkin-primary);
        }

        .tab-btn:hover:not(.active) { background: var(--surface-100); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-box {
            text-align: center;
            padding: 0.85rem 0.4rem;
            background: linear-gradient(135deg, rgba(21,101,192,0.06), rgba(21,101,192,0.02));
            border-radius: 12px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--checkin-primary);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--surface-400);
            margin-top: 0.15rem;
        }

        /* History items */
        .history-list { max-height: 380px; overflow-y: auto; }

        .history-item {
            display: flex;
            align-items: center;
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--surface-100);
        }

        .history-item:last-child { border-bottom: none; }

        .history-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        .history-icon.in { background: rgba(34,197,94,0.12); }
        .history-icon.out { background: rgba(239,68,68,0.12); }

        .history-info { flex: 1; min-width: 0; }

        .history-type {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .history-store {
            font-size: 0.7rem;
            color: var(--surface-400);
        }

        .history-time { text-align: right; }

        .history-date {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .history-hour {
            font-size: 0.7rem;
            color: var(--surface-400);
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--surface-400);
        }

        /* Toast */
        .toast-stack {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
        }

        .toast-msg {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.85rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: toastIn 0.3s ease;
            margin-bottom: 0.4rem;
            color: white;
        }

        .toast-msg.success { background: linear-gradient(135deg, #38A169, #48BB78); }
        .toast-msg.error { background: linear-gradient(135deg, #E53E3E, #FC8181); }
        .toast-msg.info { background: linear-gradient(135deg, #1565C0, #1E88E5); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 400px) {
            .live-clock { font-size: 1.6rem; }
            .action-buttons { gap: 0.75rem; }
            .btn-punch { padding: 0.85rem; font-size: 0.9rem; }
            .stats-grid { gap: 0.5rem; }
            .stat-value { font-size: 1.3rem; }
        }
    </style>
    \n
    <link rel="stylesheet" href="../../assets/css/app-shell.css" />\n
</head>

<body>
    <div class="toast-stack" id="toastStack"></div>

    <div class="page-container">
        <div class="back-row">
            <a href="index.html" class="back-link">← เมนู HR</a>
        </div>

        <!-- Clock -->
        <div class="clock-hero">
            <h1>ลงเวลาเข้า-ออกพนักงาน</h1>
            <div class="live-clock">
                <span class="material-icons-outlined" style="font-size: 2rem;">schedule</span>
                <span id="liveClock">--:--:--</span>
            </div>
            <div class="live-date" id="liveDate"></div>
        </div>

        <!-- PUNCH SECTION -->
        <div class="tab-content active" id="tab-punch">
            <div class="checkin-card">
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">กำลังโหลด...</span>
                </div>

                <div class="admin-bar" id="adminBar"><span class="material-icons-outlined" style="font-size:1.1rem;vertical-align:text-bottom">build</span> โหมดผู้ดูแลระบบ</div>

                <label class="field-label" for="deptSelect">สาขา</label>
                <select class="field-select" id="deptSelect" disabled>
                    <option>กำลังโหลดข้อมูล…</option>
                </select>

                <label class="field-label" for="nameSelect">ชื่อพนักงาน</label>
                <select class="field-select" id="nameSelect" disabled>
                    <option value="">– เลือกชื่อ –</option>
                </select>

                <div class="admin-fields" id="adminFields">
                    <div class="admin-fields-title"><span class="material-icons-outlined" style="font-size:1rem;vertical-align:text-bottom">edit_calendar</span> กำหนดเวลาแทนพนักงาน</div>
                    <div class="admin-row">
                        <div>
                            <label class="field-label" for="overrideDate">วันที่</label>
                            <input type="date" class="field-input" id="overrideDate" />
                        </div>
                        <div>
                            <label class="field-label" for="overrideTime">เวลา</label>
                            <input type="time" class="field-input" id="overrideTime" />
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-punch btn-in" id="btnIn" disabled onclick="doPunch('IN')">
                        <span class="spinner"></span>
                        <span class="btn-label"><span class="material-icons-outlined" style="font-size:1rem;vertical-align:text-bottom">login</span> เข้างาน</span>
                    </button>
                    <button class="btn-punch btn-out" id="btnOut" disabled onclick="doPunch('OUT')">
                        <span class="spinner"></span>
                        <span class="btn-label"><span class="material-icons-outlined" style="font-size:1rem;vertical-align:text-bottom">logout</span> ออกงาน</span>
                    </button>
                </div>

                <button class="admin-toggle" id="adminToggle" onclick="toggleAdmin()">
                    <span class="material-icons-outlined" style="font-size:1.1rem;vertical-align:text-bottom">admin_panel_settings</span> เข้าสู่ระบบผู้ดูแล
                </button>
            </div>
        </div>
                    <div>ยังไม่มีข้อมูลการลงเวลา</div>
                </div>
            </div>

            <div class="checkin-card" id="historyLoading" style="display: none;">
                <div class="empty-state">
                    <div class="spinner" style="display:inline-block;width:24px;height:24px;border:3px solid var(--surface-200);border-top-color:var(--checkin-primary);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:0.75rem;"></div>
                    <div>กำลังโหลดข้อมูล...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts: PocketBase services -->
    <script type="module" src="../../assets/js/app-shell.js"></script>
    <script type="module" src="./checkin.js"></script>
</body>

</html>
