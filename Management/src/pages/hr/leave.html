<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>แจ้งลางาน | Bancha HR</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="stylesheet" href="../../assets/css/design-system.css" />
    <link rel="stylesheet" href="../../assets/css/glass-ui.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <style>
        :root {
            --leave-primary: #b91c1c;
            --leave-gradient: linear-gradient(135deg, #ef4444 0%, #b91c1c 50%, #7f1d1d 100%);
        }
        body {
            background: var(--surface-50);
            background-image: radial-gradient(circle at 20% 80%, rgba(185, 28, 28, 0.04) 0%, transparent 50%);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            padding: 1rem;
        }
        .page-container {
            max-width: 520px;
            margin: 0 auto;
        }
        .back-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .back-link {
            color: var(--surface-500);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .leave-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-5);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--space-4);
        }
        .form-title {
            text-align: center;
            color: var(--leave-primary);
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: var(--space-4);
        }
        .field-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--surface-500);
            margin-bottom: 0.25rem;
        }
        .field-input, .field-select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--surface-200);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            margin-bottom: 1rem;
            background: var(--surface-50);
        }
        .field-input:focus, .field-select:focus {
            border-color: var(--leave-primary);
            outline: none;
            background: white;
        }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--leave-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
            display: none;
        }
        .loading-overlay.active { display: flex; }
    </style>
    
    <link rel="stylesheet" href="../../assets/css/app-shell.css" />
</head>
<body>
    <div class="toast-stack" id="toastStack"></div>
    <div class="loading-overlay" id="loadingOverlay">
        <span class="spinner" style="display:inline-block; border: 3px solid var(--surface-200); border-right-color: var(--leave-primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;"></span>
    </div>

    <div class="page-container">
        <div class="back-row">
            <a href="index.html" class="back-link">← เมนู HR</a>
        </div>

        <div class="leave-card">
            <div class="form-title">
                <span class="material-icons-outlined" style="vertical-align:bottom">edit_document</span> 
                แบบฟอร์มแจ้งลางาน
            </div>

            <form id="leaveForm">
                <label class="field-label">พนักงาน</label>
                <select class="field-select" id="empSelect" required>
                    <option value="">– กำลังโหลดข้อมูล –</option>
                </select>

                <label class="field-label">ประเภทการลา</label>
                <select class="field-select" id="typeSelect" required>
                    <option value="sick">ลาป่วย</option>
                    <option value="personal">ลากิจ</option>
                    <option value="vacation">ลาพักร้อน</option>
                    <option value="other">อื่นๆ</option>
                </select>

                <div style="display:flex; gap:1rem;">
                    <div style="flex:1">
                        <label class="field-label">ตั้งแต่วันที่</label>
                        <input type="date" class="field-input" id="startDate" required />
                    </div>
                    <div style="flex:1">
                        <label class="field-label">ถึงวันที่</label>
                        <input type="date" class="field-input" id="endDate" required />
                    </div>
                </div>

                <label class="field-label">เหตุผลการลา</label>
                <textarea class="field-input" id="reasonInput" rows="3" placeholder="ระบุเหตุผลการลา..." required></textarea>

                <button type="submit" class="btn-submit" id="submitBtn">ส่งใบลา</button>
            </form>
        </div>
    </div>

    <script type="module">
        import '../../services/pocketbase.js';
        import '../../utils/helpers.js';
        import '../../services/authService.js';

        let employees = [];

        function showToast(msg, type = 'info', duration = 3000) {
            const stack = document.getElementById('toastStack');
            const el = document.createElement('div');
            el.className = `toast-msg ${type}`;
            el.innerHTML = `<span>${msg}</span>`;
            stack.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, duration);
        }

        async function init() {
            document.getElementById('loadingOverlay').classList.add('active');
            try {
                // Set default dates
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('startDate').value = today;
                document.getElementById('endDate').value = today;

                const users = await window.pb.collection('users').getFullList();
                employees = users.filter(u => u.role !== 'admin');
                employees.sort((a,b) => (a.display_name || a.name || '').localeCompare(b.display_name || b.name || ''));
                
                const empSelect = document.getElementById('empSelect');
                empSelect.innerHTML = '<option value="">– เลือกพนักงาน –</option>';
                
                employees.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.display_name || u.name || u.username;
                    opt.textContent = opt.value + (u.branch ? ` (${u.branch})` : '');
                    empSelect.appendChild(opt);
                });

                const currentUser = window.AuthService?.getUser();
                const isOwner = window.AuthService?.isOwner();
                const isAdmin = window.AuthService?.hasRole?.(['admin']);
                const isManager = window.AuthService?.hasRole?.(['manager']);
                
                if (currentUser && !isOwner && !isAdmin && !isManager) {
                    const currentName = currentUser.name;
                    Array.from(empSelect.options).forEach(opt => {
                        if (opt.value === currentName) {
                            opt.selected = true;
                            empSelect.disabled = true;
                        }
                    });
                }
            } catch (e) {
                console.error(e);
                showToast('ไม่สามารถโหลดข้อมูลพนักงานได้', 'error');
            } finally {
                document.getElementById('loadingOverlay').classList.remove('active');
            }
        }

        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            document.getElementById('loadingOverlay').classList.add('active');

            try {
                const empName = document.getElementById('empSelect').value;
                const type = document.getElementById('typeSelect').value;
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const reason = document.getElementById('reasonInput').value;

                if (!empName) throw new Error('กรุณาเลือกพนักงาน');
                if (startDate > endDate) throw new Error('วันที่สิ้นสุดต้องไม่น้อยกว่าวันที่เริ่มต้น');

                await window.pb.collection('hr_leaves').create({
                    employee_id: empName,
                    name: empName,
                    type: type,
                    start_date: startDate,
                    end_date: endDate,
                    reason: reason,
                    status: 'pending'
                });

                showToast('ส่งใบลาเรียบร้อยแล้ว', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (err) {
                console.error(err);
                showToast(err.message || 'เกิดข้อผิดพลาดในการส่งใบลา', 'error');
                btn.disabled = false;
                document.getElementById('loadingOverlay').classList.remove('active');
            }
        });

        init();
    </script>
    <script type="module" src="../../assets/js/app-shell.js"></script>
</body>
</html>
