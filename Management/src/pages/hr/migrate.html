<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Migration Tool (Port 8091)</title>
    <link href="../../assets/css/style.css" rel="stylesheet" />

\n    <link rel="stylesheet" href="../../assets/css/app-shell.css" />\n\n    <link rel="stylesheet" href="../../assets/css/design-system.css" />\n</head>

<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-xl font-bold mb-4">HR Database Migration (Port 8091)</h1>
        <p class="mb-4">Click below to create the <code>hr_leaves</code> collection.</p>

        <div id="status" class="mb-4 text-sm text-gray-600"></div>

        <button id="migrate-btn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">
            Create hr_leaves Collection
        </button>

        <div class="mt-4 border-t pt-4">
            <h2 class="text-sm font-bold mb-2">Admin Login (Required if not already logged in)</h2>
            <input type="email" id="email" placeholder="Email" class="border p-2 w-full mb-2" />
            <input type="password" id="password" placeholder="Password" class="border p-2 w-full mb-2" />
            <button id="login-btn" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 w-full">
                Login
            </button>
        </div>
    </div>

    <script type="module">
        import PocketBase from 'pocketbase';

        // Start PocketBase connection on Port 8091
        const pb = new PocketBase('http://127.0.0.1:8091');

        const status = document.getElementById('status');
        const loginBtn = document.getElementById('login-btn');
        const migrateBtn = document.getElementById('migrate-btn');

        function log(msg, error = false) {
            status.innerHTML += `<div class="${error ? 'text-red-600' : 'text-green-600'}">${msg}</div>`;
        }

        loginBtn.onclick = async () => {
            try {
                await pb.admins.authWithPassword(
                    document.getElementById('email').value,
                    document.getElementById('password').value
                );
                log('Login successful!');
            } catch (e) {
                log('Login failed: ' + e.message, true);
            }
        };

        migrateBtn.onclick = async () => {
            if (!pb.authStore.isValid) {
                return log('Please login as Admin first.', true);
            }

            try {
                // Check if exists
                try {
                    await pb.collections.getOne('hr_leaves');
                    log("Collection 'hr_leaves' already exists.");
                    return;
                } catch (e) {
                    // Not found, continue
                }

                log("Creating 'hr_leaves' collection...");

                await pb.collections.create({
                    name: 'hr_leaves',
                    type: 'base',
                    schema: [
                        { name: 'employee_id', type: 'text', required: false },
                        { name: 'name', type: 'text', required: true },
                        { name: 'department', type: 'text', required: false },
                        { name: 'start_date', type: 'date', required: true },
                        { name: 'end_date', type: 'date', required: true },
                        { name: 'reason', type: 'text', required: false },
                        {
                            name: 'type',
                            type: 'select',
                            options: ['sick', 'business', 'vacation', 'other'],
                            required: false
                        }
                    ]
                });

                log("Collection 'hr_leaves' created successfully!");
            } catch (e) {
                log('Error: ' + e.message, true);
                console.error(e);
            }
        };
    </script>
\n    <script type="module" src="../../assets/js/app-shell.js"></script>\n</body>

</html>
