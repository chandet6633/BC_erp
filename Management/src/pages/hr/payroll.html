<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>สรุปเวลาทำงาน | BC Auto Service</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css" />
    <link rel="stylesheet" href="../../assets/css/page-header.css" />
    <link href="../../assets/css/style.css?v=3" rel="stylesheet" />
    <style>
        .payroll-card { background: white; border-radius: var(--radius-md); padding: var(--space-4); border: 1px solid var(--surface-200); margin-bottom: var(--space-4); }
        .payroll-card h3 { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-3); color: var(--surface-800); }
        .pay-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
        .pay-table th { text-align: left; padding: var(--space-3); border-bottom: 2px solid var(--surface-200); color: var(--surface-600); font-weight: 600; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; }
        .pay-table td { padding: var(--space-3); border-bottom: 1px solid var(--surface-100); color: var(--surface-800); }
        .pay-table tr:hover td { background: var(--surface-50); }
        .controls { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--space-5); }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-5); }
        .summary-item { text-align: left; padding: var(--space-4); background: white; border: 1px solid var(--surface-200); border-radius: var(--radius-md); display: flex; flex-direction: column-reverse; }
        .summary-item .lbl { font-size: var(--text-xs); color: var(--surface-500); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-1); }
        .summary-item .val { font-size: 1.5rem; font-weight: 600; color: var(--surface-800); }
        .cal-container { margin-top: var(--space-6); }
        .cal-row { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-4); background: white; padding: var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--surface-200); }
        .cal-header { font-weight: 600; font-size: var(--text-sm); display: flex; justify-content: space-between; align-items: center; color: var(--surface-800); border-bottom: 1px solid var(--surface-100); padding-bottom: var(--space-2); margin-bottom: var(--space-2); }
        .cal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 6px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 2px; background: var(--surface-50); color: var(--surface-400); cursor: default; border: 1px solid var(--surface-100); }
        .cal-day.in { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
        .cal-day.late { background: #fffbeb; color: #b45309; border-color: #fde68a; }
        .cal-day.leave { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
        .cal-day.weekend { background: var(--surface-100); color: var(--surface-400); border-color: transparent; }
    </style>
    
    <link rel="stylesheet" href="../../assets/css/app-shell.css" />
</head>
<body class="page-bg">
    <div class="container" style="padding-top: var(--space-4); padding-bottom: var(--space-8);">
        <div class="page-header">
            <div>
                <h1 class="page-title"><span class="material-icons-outlined" style="font-size:1.6rem;vertical-align:bottom">payments</span> สรุปเวลาทำงาน</h1>
                <p class="page-subtitle">สรุปวันทำงาน สาย ลา รายเดือน</p>
            </div>
            <a href="index.html" class="page-back-btn">← กลับ</a>
        </div>

        <div class="controls">
            <select id="branchSelect" class="input" style="width:auto;height:36px">
                <option value="all">ทุกสาขา</option>
            </select>
            <select id="monthSelect" class="input" style="width:auto;height:36px"></select>
            <select id="yearSelect" class="input" style="width:auto;height:36px"></select>
            <button class="btn btn-primary btn-sm" id="loadBtn">โหลด</button>
        </div>

        <div class="summary-grid" id="summaryGrid">
            <div class="summary-item"><div class="val" id="sumTotal">0</div><div class="lbl">พนักงาน</div></div>
            <div class="summary-item"><div class="val" id="sumWorkDays">0</div><div class="lbl">วันทำงานรวม</div></div>
            <div class="summary-item"><div class="val" id="sumLate" style="color:#d97706">0</div><div class="lbl">สายรวม</div></div>
            <div class="summary-item"><div class="val" id="sumLeave" style="color:#dc2626">0</div><div class="lbl">ลารวม</div></div>
        </div>

        <div class="payroll-card">
            <h3><span class="material-icons-outlined" style="font-size:1.2rem;vertical-align:text-bottom">list_alt</span> สรุปรายคน</h3>
            <div style="overflow-x:auto">
                <table class="pay-table" id="payrollTable">
                    <thead>
                        <tr>
                            <th>พนักงาน</th>
                            <th>สาขา</th>
                            <th style="text-align:center">วันทำงาน</th>
                            <th style="text-align:center">สาย</th>
                            <th style="text-align:center">ลา</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="cal-container" id="calendarContainer"></div>
    </div>

    <script type="module">
        import '../../services/pocketbase.js';
        import '../../utils/helpers.js';
        import '../../components/ui.js';
        import '../../services/authService.js';

        const THAI_MONTHS = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
        let selYear = new Date().getFullYear();
        let selMonth = new Date().getMonth() + 1;

        async function setup() {
            const ySel = document.getElementById('yearSelect');
            const mSel = document.getElementById('monthSelect');
            for (let y = selYear + 1; y >= selYear - 2; y--) {
                const o = document.createElement('option'); o.value = y; o.textContent = y + 543;
                if (y === selYear) o.selected = true; ySel.appendChild(o);
            }
            for (let m = 1; m <= 12; m++) {
                const o = document.createElement('option'); o.value = m; o.textContent = THAI_MONTHS[m];
                if (m === selMonth) o.selected = true; mSel.appendChild(o);
            }

            try {
                const branches = await window.pb.collection('branches').getFullList({ sort: 'name' });
                const bSel = document.getElementById('branchSelect');
                branches.forEach(b => {
                    const o = document.createElement('option');
                    o.value = b.code; o.textContent = b.name;
                    bSel.appendChild(o);
                });
            } catch (e) {
                console.error('Failed to load branches', e);
            }

            document.getElementById('loadBtn').addEventListener('click', () => {
                selYear = parseInt(ySel.value); selMonth = parseInt(mSel.value); loadPayroll();
            });
        }

        async function loadPayroll() {
            window.showLoading?.();
            try {
                const start = `${selYear}-${String(selMonth).padStart(2,'0')}-01`;
                const lastDay = new Date(selYear, selMonth, 0).getDate();
                const end = `${selYear}-${String(selMonth).padStart(2,'0')}-${lastDay}`;
                const selBranch = document.getElementById('branchSelect').value;

                let userFilter = "role != 'admin'";
                if (selBranch !== 'all') {
                    userFilter += ` && branch='${selBranch}'`;
                }

                const [users, att, leaves] = await Promise.all([
                    window.pb.collection('users').getFullList({ filter: userFilter }),
                    window.pb.collection('hr_attendance').getFullList({ filter: `timestamp >= '${start}' && timestamp <= '${end} 23:59:59'` }),
                    window.pb.collection('hr_leaves').getFullList({ filter: `start_date <= '${end}' && end_date >= '${start}'` })
                ]);

                const employees = users.filter(u => ['mechanic','sa','manager'].includes(u.role));
                const empMap = {};

                employees.forEach(e => {
                    const empName = e.display_name || e.name || e.username;
                    empMap[empName] = { name: empName, branch: e.branch || '-', workDays: 0, late: 0, leave: 0, dailyStatus: {} };
                });

                const attByEmp = {};
                att.forEach(a => {
                    const empId = a.employee_id;
                    if (!empId || !empMap[empId]) return;
                    
                    if (a.type === 'IN') {
                        const dateOnly = (a.timestamp||'').split('T')[0];
                        const day = parseInt(dateOnly.split('-')[2]);
                        if (!attByEmp[empId]) attByEmp[empId] = new Set();
                        
                        if (!attByEmp[empId].has(dateOnly)) {
                            attByEmp[empId].add(dateOnly);
                            empMap[empId].workDays++;
                            const time = (a.timestamp||'').split('T')[1] || '';
                            const isLate = time > '09:00';
                            if (isLate) empMap[empId].late++;
                            
                            empMap[empId].dailyStatus[day] = isLate ? 'late' : 'in';
                        }
                    }
                });

                leaves.forEach(l => {
                    const empId = l.employee_id;
                    if (!empId || !empMap[empId]) return;
                    
                    const lStart = new Date(l.start_date);
                    const lEnd = new Date(l.end_date);
                    const selStart = new Date(start);
                    const selEnd = new Date(end);
                    
                    let leaveDays = 0;
                    for (let d = new Date(lStart); d <= lEnd; d.setDate(d.getDate() + 1)) {
                        if (d >= selStart && d <= selEnd) {
                            leaveDays++;
                            empMap[empId].dailyStatus[d.getDate()] = 'leave';
                        }
                    }
                    empMap[empId].leave += leaveDays;
                });

                const list = Object.values(empMap).sort((a,b) => b.workDays - a.workDays);
                const totalWork = list.reduce((s,e) => s + e.workDays, 0);
                const totalLate = list.reduce((s,e) => s + e.late, 0);
                const totalLeave = list.reduce((s,e) => s + e.leave, 0);

                document.getElementById('sumTotal').textContent = list.length;
                document.getElementById('sumWorkDays').textContent = totalWork;
                document.getElementById('sumLate').textContent = totalLate;
                document.getElementById('sumLeave').textContent = totalLeave;

                const tbody = document.querySelector('#payrollTable tbody');
                tbody.innerHTML = list.map(e => `
                    <tr>
                        <td style="font-weight:600">${e.name}</td>
                        <td>${e.branch}</td>
                        <td style="text-align:center;font-weight:700">${e.workDays}</td>
                        <td style="text-align:center;color:${e.late>0?'#d97706':'var(--surface-400)'}">${e.late}</td>
                        <td style="text-align:center;color:${e.leave>0?'#dc2626':'var(--surface-400)'}">${e.leave}</td>
                    </tr>
                `).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--surface-400);padding:var(--space-4)">ไม่มีข้อมูล</td></tr>';

                // Calendar View Render
                const calContainer = document.getElementById('calendarContainer');
                let calHTML = `<h3><span class="material-icons-outlined" style="font-size:1.2rem;vertical-align:text-bottom">calendar_month</span> ปฏิทินรายคน</h3>`;
                
                if (list.length === 0) {
                    calHTML += `<div style="text-align:center;color:var(--surface-400);padding:var(--space-4)">ไม่มีข้อมูลพนักงาน</div>`;
                } else {
                    list.forEach(e => {
                        let daysHTML = '';
                        for (let d = 1; d <= lastDay; d++) {
                            const date = new Date(selYear, selMonth - 1, d);
                            const isWeekend = date.getDay() === 0;
                            const status = e.dailyStatus[d];
                            
                            let cls = 'cal-day';
                            let title = `${d} ${THAI_MONTHS[selMonth]}`;
                            
                            if (status === 'in') { cls += ' in'; title += ' (เข้างาน)'; }
                            else if (status === 'late') { cls += ' late'; title += ' (สาย)'; }
                            else if (status === 'leave') { cls += ' leave'; title += ' (ลา)'; }
                            else if (isWeekend) { cls += ' weekend'; title += ' (วันหยุด)'; }
                            
                            daysHTML += `<div class="${cls}" title="${title}">${d}</div>`;
                        }
                        
                        calHTML += `
                            <div class="cal-row">
                                <div class="cal-header">
                                    <span>${e.name}</span>
                                    <span style="color:var(--surface-500);font-weight:400;font-size:11px">${e.branch}</span>
                                </div>
                                <div class="cal-grid">${daysHTML}</div>
                            </div>
                        `;
                    });
                }
                calContainer.innerHTML = calHTML;

                window.showToast?.('โหลดสำเร็จ', 'success');
            } catch (err) {
                console.error('Payroll error:', err);
                window.showToast?.('โหลดไม่สำเร็จ', 'error');
            }
            window.hideLoading?.();
        }

        setup().then(() => loadPayroll());
    </script>
    \n
    <script type="module" src="../../assets/js/app-shell.js"></script>\n
</body>
</html>
