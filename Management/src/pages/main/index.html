<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>BC Auto Xperience - ระบบจัดการรายรับรายจ่าย</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=7" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BC Auto">
    <!-- Google Fonts: Inter for professional typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <!-- Design System & App Shell -->
    <link rel="stylesheet" href="../../assets/css/design-system.css" />
    <link rel="stylesheet" href="../../assets/css/app-shell.css" />
    <link href="../../assets/css/style.css?v=3" rel="stylesheet" />

    <script type="module" src="./main-auth.js"></script>
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 30%, #dbeafe 60%, #eff6ff 100%);
        }

        /* ===== MENU GRID ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 24px;
            align-content: start;
            align-items: start;
        }

        .menu-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .menu-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 40px -12px rgba(59, 130, 246, 0.15), 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        .menu-card:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .menu-card .icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 1.75rem;
        }

        .menu-card .title {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .menu-card .desc {
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.5;
        }

        /* ===== AUTH MODAL (Full-screen overlay) ===== */
        #auth-modal {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #151D3A 0%, #1E2A4F 40%, #2A3B6E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        #auth-modal.hidden {
            display: none !important;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .auth-logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
            padding: 12px;
        }

        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .auth-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: white;
            margin-bottom: 4px;
            letter-spacing: -0.025em;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 32px;
        }

        /* ===== ROLE CARDS GRID ===== */
        .role-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 28px 16px 24px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .role-card:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.3);
        }

        .role-card:active {
            transform: translateY(0) scale(0.97);
        }

        .role-card:focus {
            outline: 2px solid white;
            outline-offset: 3px;
            border-radius: 20px;
        }

        .role-card-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .role-card-icon svg {
            width: 28px;
            height: 28px;
        }

        .role-card-icon.blue {
            background: rgba(59, 130, 246, 0.3);
            color: white;
        }

        .role-card-icon.green {
            background: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .role-card-icon.amber {
            background: rgba(245, 158, 11, 0.3);
            color: #fcd34d;
        }

        .role-card-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: white;
            line-height: 1.3;
        }

        .role-card-sub {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: -4px;
        }

        @media (max-width: 480px) {
            .role-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                max-width: 280px;
                margin: 0 auto;
            }

            .role-card {
                flex-direction: row;
                padding: 16px 20px;
                text-align: left;
            }

            .role-card-icon {
                width: 44px;
                height: 44px;
            }
        }

        /* ===== PIN POPUP OVERLAY ===== */
        .pin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .pin-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .pin-popup {
            background: white;
            border-radius: 24px;
            padding: 32px 28px 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.3);
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pin-popup-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .pin-popup-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin-popup-icon svg {
            width: 22px;
            height: 22px;
        }

        .pin-popup-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .pin-popup-sub {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 16px;
        }

        .pin-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 16px 0;
        }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e2e8f0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pin-dot.active {
            background: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            transform: scale(1.15);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 240px;
            margin: 12px auto 0;
        }

        .num-btn {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
        }

        .num-btn:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .num-btn:active {
            transform: scale(0.95);
            background: #dbeafe;
        }

        .num-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .num-btn-clear {
            color: #ef4444;
            background: #fef2f2;
            border-color: #fecaca;
        }

        .num-btn-clear:hover {
            background: #fee2e2;
        }

        .num-btn-ok {
            color: white;
            background: linear-gradient(135deg, #1e40af, #2563eb);
            border: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .num-btn-ok:hover {
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .auth-error-msg {
            color: #dc2626;
            font-size: 0.78rem;
            margin-top: 8px;
            padding: 8px 12px;
            background: #fef2f2;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        .auth-error-msg.hidden {
            display: none;
        }

        .pin-back-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .pin-back-btn:hover {
            background: #f1f5f9;
            color: #334155;
        }

        .pin-back-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        /* ===== BRANCH SWITCHER ===== */
        .branch-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .branch-btn {
            padding: 12px 20px;
            border-radius: 14px;
            border: 2px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .branch-btn:hover {
            border-color: #93c5fd;
            background: white;
        }

        .branch-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .branch-btn.active {
            border-color: #2563eb;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            color: #1e40af;
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.12);
        }

        .branch-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ===== HEADER BAR ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .app-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
        }

        .logout-btn {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn:hover {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #dc2626;
        }

        .logout-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .logout-btn svg {
            width: 16px;
            height: 16px;
        }

        .branch-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* Animation helper */
        .animate-slide-up {
            animation: cardSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== COMMAND CENTER HERO ===== */
        .hero-section {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border-radius: 24px;
            padding: 32px;
            color: white;
            margin-bottom: 32px;
            box-shadow: 0 20px 40px -12px rgba(37, 99, 235, 0.3);
            position: relative;
            overflow: hidden;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='rgba(255,255,255,0.05)' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.8;
            pointer-events: none;
        }

        .hero-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .hero-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .hero-date {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 100px;
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .kpi-widget {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .kpi-widget-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .kpi-widget-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }



        .kpi-breakdown {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
        }

        .kpi-branch-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kpi-branch-name {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .kpi-branch-value {
            color: rgba(252, 211, 77, 0.9);
            font-size: 0.8rem;
            font-weight: 700;
        }

        .kpi-branch-value small {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            font-size: 0.7rem;
        }

        /* ===== TOOL CATEGORY ===== */
        .category-group {
            margin-bottom: 40px;
        }
        
        .category-header {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        /* ===== SKELETON LOADER ===== */
        .skeleton {
            background: #e2e8f0;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== MOBILE RESPONSIVE ===== */
        
        /* Touch optimization for all buttons */
        button, .num-btn, .role-card, .menu-card, .pin-key {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Input focus glow */
        #loginUsername:focus, #loginPassword:focus,
        #newPassword:focus, #confirmPassword:focus {
            border-color: rgba(200, 160, 72, 0.6) !important;
            box-shadow: 0 0 0 3px rgba(200, 160, 72, 0.15);
        }

        /* Login form placeholder color */
        #auth-modal input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 640px) {
            /* Auth modal fills screen */
            #auth-modal {
                padding: 16px;
                align-items: flex-start;
                padding-top: 10vh;
            }
            
            .auth-container {
                max-width: 100%;
            }
            
            .auth-logo {
                width: 80px;
                height: 80px;
                border-radius: 18px;
                margin-bottom: 12px;
                padding: 8px;
            }
            
            .auth-title {
                font-size: 1.3rem;
            }

            /* Role grid: 2-column on mobile */
            .role-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 10px;
            }

            /* Tool grid: full-width stack */
            .menu-grid {
                grid-template-columns: 1fr !important;
                gap: 12px;
            }

            .menu-card {
                flex-direction: row;
                padding: 16px 20px;
                text-align: left;
                border-radius: 14px;
            }

            .menu-card .icon {
                width: 44px;
                height: 44px;
                border-radius: 12px;
                margin-bottom: 0;
                margin-right: 14px;
                font-size: 1.3rem;
                flex-shrink: 0;
            }

            .menu-card .title {
                font-size: 0.9rem;
            }

            .menu-card .desc {
                font-size: 0.75rem;
            }

            .menu-card:hover {
                transform: none;
            }

            /* Hero section */
            .hero-section {
                padding: 20px 16px !important;
                border-radius: 14px !important;
            }

            .hero-kpis {
                grid-template-columns: 1fr 1fr !important;
                gap: 10px !important;
            }

            .kpi-widget {
                padding: 14px !important;
                border-radius: 12px !important;
            }

            .kpi-widget-value {
                font-size: 1.4rem !important;
            }

            /* Category header */
            .category-header {
                font-size: 1rem;
            }

            /* Numpad - already responsive but ensure 56px min */
            .num-btn {
                min-height: 52px;
                font-size: 1.3rem;
            }

            /* Branch buttons */
            .branch-btn {
                padding: 8px 12px !important;
                font-size: 0.8rem !important;
            }

            /* Header */
            .app-header {
                padding: 8px 12px !important;
            }

            .header-logo {
                height: 30px;
            }

            .logout-btn {
                padding: 6px 10px;
                font-size: 0.75rem;
            }

            /* Main content spacing */
            .main-content, #command-center {
                padding: 16px !important;
            }
        }

        /* Small phone (≤380px) */
        @media (max-width: 380px) {
            #auth-modal { padding-top: 5vh; }
            .auth-logo { width: 64px; height: 64px; }
            .auth-title { font-size: 1.1rem; }
            .role-grid { grid-template-columns: 1fr !important; }
        }

        /* Loading spinner animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Auth Modal (Full-Screen Login) -->
    <div id="auth-modal" class="hidden">
        <div class="auth-container">
            <!-- Logo -->
            <div class="auth-logo">
                <img src="/logo-app.png?v=7" alt="BC Auto Logo" />
            </div>
            <h1 class="auth-title">
                BC AUTO XPERIENCE
            </h1>
            <p class="auth-subtitle">เข้าสู่ระบบ</p>

            <!-- ═══ USERNAME/PASSWORD FORM (Primary) ═══ -->
            <div id="loginFormSection" style="width:100%;text-align:left;">
                <div style="display:flex;flex-direction:column;gap:14px;margin-bottom:14px;">
                    <div>
                        <label for="loginUsername" style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:6px;display:block;">ชื่อผู้ใช้</label>
                        <input type="text" id="loginUsername" placeholder="เช่น bank, chai, noi"
                               autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"
                               style="width:100%;padding:14px 16px;font-size:16px;border:2px solid rgba(255,255,255,0.3);border-radius:14px;background:rgba(255,255,255,0.15);color:white;outline:none;transition:border-color 0.2s;box-sizing:border-box;backdrop-filter:blur(8px);">
                    </div>
                    <div style="position:relative;">
                        <label for="loginPassword" style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:6px;display:block;">รหัสผ่าน</label>
                        <input type="password" id="loginPassword" placeholder="รหัสผ่าน"
                               autocomplete="current-password"
                               style="width:100%;padding:14px 48px 14px 16px;font-size:16px;border:2px solid rgba(255,255,255,0.3);border-radius:14px;background:rgba(255,255,255,0.15);color:white;outline:none;transition:border-color 0.2s;box-sizing:border-box;backdrop-filter:blur(8px);">
                        <button type="button" id="togglePassword" 
                                style="position:absolute;right:12px;bottom:12px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.6);padding:4px;font-size:20px;">
                            👁
                        </button>
                    </div>
                </div>

                <!-- Remember me -->
                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:rgba(255,255,255,0.7);margin-bottom:20px;cursor:pointer;">
                    <input type="checkbox" id="rememberMe" checked style="width:18px;height:18px;accent-color:#3b82f6;">
                    จดจำฉัน
                </label>

                <!-- Login button -->
                <button id="loginBtn" onclick="window.submitUsernameLogin()"
                        style="width:100%;padding:16px;font-size:1rem;font-weight:700;min-height:56px;border:none;border-radius:14px;background:white;color:#1e40af;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;">
                    🔑 เข้าสู่ระบบ
                </button>

                <!-- Error -->
                <div id="login-error" style="color:#fca5a5;text-align:center;margin-top:12px;display:none;font-size:0.9rem;"></div>

                <!-- Divider -->
                <div style="display:flex;align-items:center;gap:12px;margin:24px 0;">
                    <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,0.2);">
                    <span style="font-size:0.8rem;color:rgba(255,255,255,0.5);">หรือ</span>
                    <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,0.2);">
                </div>

                <!-- PIN login link (secondary) -->
                <button id="switchToPinBtn" onclick="window.showPinSection()"
                        style="width:100%;padding:12px;font-size:0.9rem;border:1px solid rgba(255,255,255,0.3);border-radius:14px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;">
                    🔢 เข้าด้วย PIN (สำหรับเครื่องกลาง)
                </button>

                <!-- Forgot password hint -->
                <p id="forgotHint" style="text-align:center;margin-top:16px;font-size:0.8rem;color:rgba(255,255,255,0.5);cursor:pointer;"
                   onclick="this.innerHTML='📞 ติดต่อผู้จัดการเพื่อรีเซ็ตรหัสผ่าน'">
                    ลืมรหัสผ่าน?
                </p>
            </div>

            <!-- ═══ PIN ROLE SELECTION (Secondary — hidden initially) ═══ -->
            <div id="pinRoleSection" style="display:none;width:100%;">
                <p style="text-align:center;font-size:0.9rem;color:rgba(255,255,255,0.7);margin-bottom:16px;">เลือกประเภทผู้ใช้</p>
                <div class="role-grid">
                    <button onclick="selectRole('manager')" class="role-card" aria-label="ผู้จัดการ">
                        <div class="role-card-icon blue">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>
                            </svg>
                        </div>
                        <span class="role-card-label">ผู้จัดการ</span>
                    </button>
                    <button onclick="selectRole('mechanic')" class="role-card" aria-label="ช่าง">
                        <div class="role-card-icon" style="background:rgba(234,88,12,0.3);color:#fdba74;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                            </svg>
                        </div>
                        <span class="role-card-label">ช่าง</span>
                    </button>
                    <button onclick="selectRole('sa')" class="role-card" aria-label="SA">
                        <div class="role-card-icon" style="background:rgba(34,197,94,0.3);color:#86efac;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                        </div>
                        <span class="role-card-label">SA</span>
                    </button>
                </div>
                <button onclick="window.showLoginForm()" 
                        style="width:100%;margin-top:16px;padding:12px;font-size:0.9rem;border:1px solid rgba(255,255,255,0.3);border-radius:14px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
                    ← กลับไปล็อกอินด้วยรหัสผ่าน
                </button>
            </div>

            <!-- ═══ FORCE CHANGE PASSWORD ═══ -->
            <div id="changePasswordSection" style="display:none;width:100%;text-align:left;">
                <div style="text-align:center;margin-bottom:20px;">
                    <div style="font-size:48px;margin-bottom:8px;">🔒</div>
                    <h2 style="font-size:1.2rem;color:white;margin:0 0 4px;">กรุณาตั้งรหัสผ่านใหม่</h2>
                    <p style="font-size:0.85rem;color:rgba(255,255,255,0.6);">รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร</p>
                </div>
                <div style="display:flex;flex-direction:column;gap:14px;">
                    <div>
                        <label style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:6px;display:block;">รหัสผ่านใหม่</label>
                        <input type="password" id="newPassword" placeholder="อย่างน้อย 4 ตัวอักษร"
                               style="width:100%;padding:14px 16px;font-size:16px;border:2px solid rgba(255,255,255,0.3);border-radius:14px;background:rgba(255,255,255,0.15);color:white;outline:none;box-sizing:border-box;">
                    </div>
                    <div>
                        <label style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:6px;display:block;">ยืนยันรหัสผ่าน</label>
                        <input type="password" id="confirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง"
                               style="width:100%;padding:14px 16px;font-size:16px;border:2px solid rgba(255,255,255,0.3);border-radius:14px;background:rgba(255,255,255,0.15);color:white;outline:none;box-sizing:border-box;">
                    </div>
                    <button id="changePasswordBtn" onclick="window.submitNewPassword()"
                            style="width:100%;padding:16px;font-size:1rem;font-weight:700;min-height:56px;border:none;border-radius:14px;background:white;color:#1e40af;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
                        ตั้งรหัสผ่าน
                    </button>
                    <div id="change-password-error" style="color:#fca5a5;text-align:center;display:none;font-size:0.9rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PIN Popup Overlay (appears on top when role is clicked) -->
    <div id="pin-overlay" class="pin-overlay" onclick="if(event.target===this) closePinPopup()">
        <div class="pin-popup">
            <div class="pin-popup-header">
                <div class="pin-popup-icon" id="pin-popup-icon"></div>
                <span class="pin-popup-title" id="pin-instr"></span>
            </div>
            <p class="pin-popup-sub">กรุณาใส่รหัส PIN เพื่อเข้าใช้งาน</p>
            <div class="pin-display">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
            <div class="numpad">
                <button class="num-btn" onclick="pressKey('1')">1</button>
                <button class="num-btn" onclick="pressKey('2')">2</button>
                <button class="num-btn" onclick="pressKey('3')">3</button>
                <button class="num-btn" onclick="pressKey('4')">4</button>
                <button class="num-btn" onclick="pressKey('5')">5</button>
                <button class="num-btn" onclick="pressKey('6')">6</button>
                <button class="num-btn" onclick="pressKey('7')">7</button>
                <button class="num-btn" onclick="pressKey('8')">8</button>
                <button class="num-btn" onclick="pressKey('9')">9</button>
                <button class="num-btn num-btn-clear" onclick="clearPIN()">C</button>
                <button class="num-btn" onclick="pressKey('0')">0</button>
                <button class="num-btn num-btn-ok" onclick="submitAuth()">OK</button>
            </div>
            <p id="auth-error" class="auth-error-msg hidden"></p>
            <button onclick="closePinPopup()" class="pin-back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="display:inline;vertical-align:middle;margin-right:4px">
                    <path d="m12 19-7-7 7-7" />
                    <path d="M19 12H5" />
                </svg>
                กลับไปเลือกประเภทผู้ใช้งาน
            </button>
        </div>
    </div>

    <main class="container py-8"
        style="max-width:1100px; margin:0 auto; padding:32px 20px; min-height: 85vh; display: flex; flex-direction: column;">
        <!-- The Global AppShell handles the Topbar, Branch Switcher, and User Actions now -->

        <div id="command-center" style="display: none;">
            <!-- Hero Section -->
            <div class="hero-section">
                <div class="hero-header">
                    <div>
                        <h1 class="hero-title" id="greeting-text">สวัสดี</h1>
                        <p class="hero-subtitle">ระบบจัดการ BC Auto Xperience</p>
                    </div>
                    <div style="display:flex;align-items:center;gap:12px;">
                        <div class="hero-date" id="current-date-time">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <span>Loading...</span>
                    </div>
                    </div>
                </div>

                <div class="kpi-row" id="hero-kpis">
                    <!-- Skeletons -->
                    <div class="kpi-widget skeleton" style="height: 100px;"></div>
                    <div class="kpi-widget skeleton" style="height: 100px;"></div>
                    <div class="kpi-widget skeleton" style="height: 100px;"></div>
                </div>
            </div>

            <!-- Tools Container -->
            <div id="tool-categories" style="flex: 1;">
                <!-- Tools will be rendered here grouped by category -->
            </div>
        </div>

        <footer
            style="text-align: center; margin-top: 40px; padding-top: 20px; color: var(--surface-400); font-size: var(--text-xs); border-top: 1px solid var(--surface-200);">
            v1.1.0 &bull; BC AutoXperience Command Center
        </footer>
    </main>

    <script type="module" src="./main-auth.js"></script>

    <!-- Execute App Shell Layout Renderer -->
    <script type="module" src="../../assets/js/app-shell.js"></script>
</body>

</html>
