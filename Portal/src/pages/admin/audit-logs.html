<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Logs - BC Auto Admin</title>
    <link rel="stylesheet" href="../../assets/css/design-system.css" />
    <style>
        body {
            padding: var(--space-6);
            background: var(--surface-50);
        }

        .log-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .log-table th {
            background: var(--surface-100);
            padding: var(--space-3);
            text-align: left;
            font-size: var(--text-xs);
            text-transform: uppercase;
            color: var(--surface-600);
        }

        .log-table td {
            padding: var(--space-3);
            border-bottom: 1px solid var(--surface-200);
            font-size: var(--text-sm);
        }

        .log-table tr:hover {
            background: var(--surface-0);
        }

        .status-tag {
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
        }

        .role-admin {
            color: var(--primary-700);
            background: var(--primary-100);
        }

        .role-manager {
            color: var(--secondary-700);
            background: var(--secondary-100);
        }

        .role-employee {
            color: var(--surface-700);
            background: var(--surface-200);
        }
    </style>
    <link rel="stylesheet" href="../../assets/css/app-shell.css" />
</head>

<body>
    <div class="container mx-auto">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold">Audit Logs</h1>
                <p class="text-sub">Tracking system activity and security events</p>
            </div>
            <div class="flex gap-2">
                <button class="btn btn-ghost" onclick="window.location.href='index.html'">⬅ Back</button>
                <button class="btn btn-primary" onclick="loadLogs()">🔄 Refresh</button>
            </div>
        </div>

        <div class="card p-0 overflow-hidden bg-white shadow-sm border border-surface-200">
            <div class="p-4 border-bottom flex gap-4 bg-surface-50">
                <input type="text" id="search-input" class="input flex-grow"
                    placeholder="Search by name or action..." />
                <select id="module-filter" class="input" style="width: 150px">
                    <option value="">All Modules</option>
                    <option value="auth">Auth</option>
                    <option value="system">System</option>
                    <option value="admin">Admin</option>
                    <option value="branch-operations">Branch Operations</option>
                </select>
            </div>
            <table class="log-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>User</th>
                        <th>Role</th>
                        <th>Action</th>
                        <th>Details</th>
                        <th>Module</th>
                        <th>Branch</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <tr>
                        <td colspan="7" class="text-center py-8">Loading logs...</td>
                    </tr>
                </tbody>
            </table>
            <div class="p-4 flex justify-between items-center bg-surface-50 border-top">
                <span id="log-count" class="text-xs text-sub">... logs found</span>
                <div class="flex gap-2">
                    <button class="btn btn-sm" id="prev-page">Prev</button>
                    <span id="page-num" class="text-sm font-medium">Page 1</span>
                    <button class="btn btn-sm" id="next-page">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { AuthService } from '../../services/authService.js';
        import { AuditService } from '../../services/auditService.js';

        // Security Gate
        if (!AuthService.hasRole(['admin', 'manager', 'owner'])) {
            AuthService.requireRole(['admin', 'manager', 'owner']);
        }

        let currentPage = 1;

        async function loadLogs() {
            const logBody = document.getElementById('log-body');
            const logCount = document.getElementById('log-count');
            const search = document.getElementById('search-input').value;
            const module = document.getElementById('module-filter').value;

            let filter = '';
            if (search) filter += `(user_name ~ '${search}' || action ~ '${search}' || details ~ '${search}')`;
            if (module) {
                if (filter) filter += ' && ';
                filter += `module = '${module}'`;
            }

            try {
                const result = await AuditService.getLogs(filter, currentPage);

                logBody.innerHTML = result.items.length ? '' : '<tr><td colspan="7" class="text-center py-8">No logs found</td></tr>';

                result.items.forEach(log => {
                    const tr = document.createElement('tr');
                    const time = new Date(log.timestamp).toLocaleString('th-TH');
                    tr.innerHTML = `
                            <td class="whitespace-nowrap">${time}</td>
                            <td class="font-medium">${window.escHtml(log.user_name)}</td>
                            <td><span class="status-tag role-${window.escHtml(log.role)}">${window.escHtml(log.role)}</span></td>
                            <td class="font-bold text-primary-600">${window.escHtml(log.action)}</td>
                            <td class="text-xs max-w-xs truncate" title="${window.escHtml(log.details)}">${window.escHtml(log.details)}</td>
                            <td><span class="badge badge-outline text-xs">${window.escHtml(log.module)}</span></td>
                            <td class="text-xs">${window.escHtml(log.branch || '-')}</td>
                        `;
                    logBody.appendChild(tr);
                });

                logCount.textContent = `${result.totalItems} logs found`;
                document.getElementById('page-num').textContent = `Page ${result.page} of ${result.totalPages}`;
                document.getElementById('prev-page').disabled = result.page <= 1;
                document.getElementById('next-page').disabled = result.page >= result.totalPages;

            } catch (error) {
                logBody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-danger">Error: ${error.message}</td></tr>`;
            }
        }

        window.loadLogs = loadLogs;
        document.getElementById('search-input').addEventListener('input', () => {
            currentPage = 1;
            loadLogs();
        });
        document.getElementById('module-filter').addEventListener('change', () => {
            currentPage = 1;
            loadLogs();
        });
        document.getElementById('prev-page').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                loadLogs();
            }
        });
        document.getElementById('next-page').addEventListener('click', () => {
            currentPage++;
            loadLogs();
        });

        loadLogs();
    </script>
    <script type="module" src="../../assets/js/app-shell.js"></script>
</body>

</html>
