<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>BC Auto - จัดการรายการ</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=7" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BC Auto Ops">
    <link rel="stylesheet" href="../../assets/css/design-system.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 30%, #dbeafe 60%, #eff6ff 100%);
            margin: 0;
        }

        /* ===== MENU GRID ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 24px;
            align-content: start;
            align-items: start;
        }

        .menu-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .menu-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 40px -12px rgba(59, 130, 246, 0.15), 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        .menu-card .icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 1.75rem;
        }

        .menu-card .title {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .menu-card .desc {
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.5;
        }

        /* Animation helper */
        .animate-slide-up {
            animation: cardSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main class="container py-8"
        style="max-width:1100px; margin:0 auto; padding:32px 20px; min-height: 85vh; display: flex; flex-direction: column;">

        <!-- Tools will be rendered here -->
        <div id="tool-grid" class="menu-grid" style="flex: 1;">
        </div>

        <footer
            style="text-align: center; margin-top: 40px; padding-top: 20px; color: var(--surface-400); font-size: var(--text-xs); border-top: 1px solid var(--surface-200);">
            v1.1.0 &bull; Refined Utility Design
        </footer>
    </main>

    <!-- Global App Shell -->
    <script type="module" src="../../assets/js/app-shell.js"></script>

    <!-- Render Logic -->
    <script type="module">
        import { TOOLS } from '../../registry.js';
        import { ConfigService } from '../../services/configService.js';
        import { AuthService } from '../../services/authService.js';
        import { getSession, isRealBranchId, setSessionBranch } from '@shared/session.js';

        // The specific tools we want to show on this sub-page
        const OPERATIONS_TOOLS_IDS = ['audit', 'entry', 'verification'];

        async function initPage() {
            await ConfigService.init();
            renderTools();
        }

        window.handleToolClick = (tool) => {
            if (tool.branch && isRealBranchId(tool.branch)) setSessionBranch(tool.branch, { locked: true });
            window.location.href = tool.path || tool.url;
        };

        function renderTools() {
            const user = AuthService.getUser();
            const grid = document.getElementById('tool-grid');

            if (!user) {
                window.location.href = '/pages/main/index.html'; // Redirect if not logged in
                return;
            }

            // Filter tools strictly by the IDs we want, AND check if the user has access
            const allowedTools = TOOLS.filter(tool => {
                // Must be one of the operation tools
                if (!OPERATIONS_TOOLS_IDS.includes(tool.id)) return false;

                // Check permissions dynamically via service
                const branch = getSession().branchId || '';
                return ConfigService.hasAccess(user.role, tool.id, branch);
            });

            grid.innerHTML = allowedTools.map((tool, i) => `
                <a href="javascript:void(0)"
                   onclick="window.handleToolClick(${JSON.stringify(tool).replace(/"/g, '&quot;')})"
                   class="menu-card animate-slide-up"
                   style="animation-delay: ${0.08 * (i + 1)}s"
                   role="button" tabindex="0"
                   aria-label="${tool.title}">
                    <div class="icon">${tool.icon}</div>
                    <div class="title">${tool.title}</div>
                    <div class="desc">${tool.description || tool.group || 'Utility'}</div>
                </a>
            `).join('');

            if (allowedTools.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">คุณไม่มีสิทธิ์เข้าถึงเมนูในหมวดหมู่นี้</div>';
            }
        }

        initPage();
    </script>
</body>

</html>
