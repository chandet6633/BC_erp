<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
      .logo-text {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 160px;
        fill: #4382f6; /* Matching the vibrant blue from your screenshot */
        text-anchor: middle;
        dominant-baseline: central;
        letter-spacing: -3px;
      }
      .tm-symbol {
        font-size: 50px;
        dominant-baseline: hanging;
        letter-spacing: 0px;
      }
    </style>
  </defs>
  <!-- Transparent background so you can use it anywhere! -->
  <text x="50%" y="50%" class="logo-text">GLASSIFY<tspan class="tm-symbol" dy="-50px" dx="10px">™</tspan></text>
</svg>
