<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 140" width="440" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&amp;family=Orbitron:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Light background -->
  <rect width="440" height="140" fill="#f0f0f0"/>

  <!-- Kanji stacked -->
  <text x="68" y="62" text-anchor="middle" font-family="'Shippori Mincho', serif" font-weight="800" font-size="50" fill="#0A0A12">顕</text>
  <text x="68" y="120" text-anchor="middle" font-family="'Shippori Mincho', serif" font-weight="800" font-size="50" fill="#0A0A12">照</text>

  <!-- Slash -->
  <line x1="112" y1="18" x2="100" y2="128" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>

  <!-- KENSHO -->
  <text x="135" y="78" font-family="'Orbitron', sans-serif" font-weight="700" font-size="38" fill="#0A0A12" letter-spacing="4">KENSHO</text>

  <!-- BEAM -->
  <text x="138" y="102" font-family="'Orbitron', sans-serif" font-weight="400" font-size="14" fill="#0EA5E9" letter-spacing="9">B E A M</text>

</svg>
