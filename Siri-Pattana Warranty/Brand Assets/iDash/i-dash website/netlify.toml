headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[functions]

  [functions."*"]

[build]
publish = "D:\\Work(viriyah desk)\\คู่มือปฏิบัติงานและฝึกอบรมพนักงาน BC AutoXperience\\product website\\I-dash website"
publishOrigin = "config"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  X-XSS-Protection = "1; mode=block"

[[headers]]
for = "/_next/static/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/img/*"

  [headers.values]
  Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/video/*"

  [headers.values]
  Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/*.webp"

  [headers.values]
  Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/*.png"

  [headers.values]
  Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/*.html"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
from = "/product/*"
to = "/product/:splat/index.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]