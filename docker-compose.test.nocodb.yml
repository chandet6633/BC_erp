#  BC AUTO XPERIENCE โ€” Docker Compose (DEV / Active Environment)
# โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•
#  This is the ACTIVE development stack. All real data is here.
#  4-container stack:
#    1. NocoDB (SQLite)        โ€” port 9080  (UI + API)
#    2. API Server (Express)   โ€” port 9093  (middleware)
#    3. MungkhudShop (Nginx)   โ€” port 9091  (POS app)
#    4. Management (Nginx)     โ€” port 9092  (back-office)
#
#  Usage:
#    Start:  docker compose -f docker-compose.test.nocodb.yml up -d --build
#    Stop:   docker compose -f docker-compose.test.nocodb.yml down
#    Logs:   docker compose -f docker-compose.test.nocodb.yml logs -f
#    Reset:  docker compose -f docker-compose.test.nocodb.yml down -v
# โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•โ•

name: webapp

services:

  # โ”€โ”€โ”€ NocoDB (API + Built-in SQLite) โ”€โ”€โ”€
  test-nocodb:
    image: nocodb/nocodb:latest
    container_name: bctest-nocodb
    profiles: ["local-nocodb"]
    restart: unless-stopped
    environment:
      NC_AUTH_JWT_SECRET: bctest_jwt_secret_local_only
      NC_PUBLIC_URL: "http://localhost:9080"
      NC_DISABLE_TELE: "true"
    ports:
      - "9080:8080"
    volumes:
      - bctest-nocodb-data:/usr/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bctest-net

  # โ”€โ”€โ”€ API Server (Express middleware) โ”€โ”€โ”€
  test-api:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: bctest-api
    restart: unless-stopped
    environment:
      NOCODB_URL: "https://nocodb.bcauto.work"
      NOCODB_BASE_TITLE: "BC_ERP_testing"
      NOCODB_TOKEN: "${NOCODB_TOKEN:?Set NOCODB_TOKEN}"
      JWT_SECRET: "bcauto_jwt_secret_2026_change_in_production"
      PORT: "3000"
      ENABLE_DEV_ROUTES: "true"
    ports:
      - "9093:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bctest-net

  # โ”€โ”€โ”€ MungkhudShop Frontend โ”€โ”€โ”€
  test-mungkhud:
    image: nginx:alpine
    container_name: bctest-mungkhud
    restart: unless-stopped
    volumes:
      - ./MungkhudShop/dist:/usr/share/nginx/html:ro
      - ./nginx-test-mungkhud.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9091:80"
    depends_on:
      test-api:
        condition: service_healthy
    networks:
      - bctest-net

  # โ”€โ”€โ”€ Management Frontend โ”€โ”€โ”€
  test-management:
    image: nginx:alpine
    container_name: bctest-management
    restart: unless-stopped
    volumes:
      - ./Management/dist:/usr/share/nginx/html:ro
      - ./nginx-test-management.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9092:80"
    depends_on:
      test-api:
        condition: service_healthy
    networks:
      - bctest-net

networks:
  bctest-net:
    driver: bridge

volumes:
  bctest-nocodb-data:
