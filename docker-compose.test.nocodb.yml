# ═══════════════════════════════════════════════════════════════
#  BC AUTO XPERIENCE — Docker Compose (TEST — NocoDB + API Server)
# ═══════════════════════════════════════════════════════════════
#  4-container stack:
#    1. NocoDB (SQLite)        — port 9080
#    2. API Server (Express)   — port 9093
#    3. MungkhudShop (Nginx)   — port 9091
#    4. Management (Nginx)     — port 9092
#
#  Usage:
#    Start:  docker compose -f docker-compose.test.nocodb.yml up -d --build
#    Stop:   docker compose -f docker-compose.test.nocodb.yml down
#    Logs:   docker compose -f docker-compose.test.nocodb.yml logs -f
#    Reset:  docker compose -f docker-compose.test.nocodb.yml down -v
# ═══════════════════════════════════════════════════════════════

services:

  # ─── NocoDB (API + Built-in SQLite) ───
  test-nocodb:
    image: nocodb/nocodb:latest
    container_name: bctest-nocodb
    restart: unless-stopped
    environment:
      NC_AUTH_JWT_SECRET: bctest_jwt_secret_local_only
      NC_PUBLIC_URL: "http://localhost:9080"
      NC_DISABLE_TELE: "true"
    ports:
      - "9080:8080"
    volumes:
      - bctest-nocodb-data:/usr/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bctest-net

  # ─── API Server (Express middleware) ───
  test-api:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: bctest-api
    restart: unless-stopped
    environment:
      NOCODB_URL: "http://bctest-nocodb:8080"
      NOCODB_TOKEN: "UmqurJUh0NhbrQWnhMJ-sXRgA6wfrlX4dvk9Y5YD"
      JWT_SECRET: "bcauto_jwt_secret_2026_change_in_production"
      PORT: "3000"
    ports:
      - "9093:3000"
    depends_on:
      test-nocodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bctest-net

  # ─── MungkhudShop Frontend ───
  test-mungkhud:
    image: nginx:alpine
    container_name: bctest-mungkhud
    restart: unless-stopped
    volumes:
      - ./MungkhudShop/pb_public:/usr/share/nginx/html:ro
      - ./nginx-test-mungkhud.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9091:80"
    depends_on:
      test-api:
        condition: service_healthy
    networks:
      - bctest-net

  # ─── Management Frontend ───
  test-management:
    image: nginx:alpine
    container_name: bctest-management
    restart: unless-stopped
    volumes:
      - ./Management/pb_public:/usr/share/nginx/html:ro
      - ./nginx-test-management.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9092:80"
    depends_on:
      test-api:
        condition: service_healthy
    networks:
      - bctest-net

networks:
  bctest-net:
    driver: bridge

volumes:
  bctest-nocodb-data:
