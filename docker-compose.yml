# ═══════════════════════════════════════════════════════════════
#  BC AUTO XPERIENCE — Docker Compose (Production — NocoDB + API Server)
# ═══════════════════════════════════════════════════════════════
#  4-container stack:
#    1. NocoDB (SQLite)        — port 8080 (internal)
#    2. API Server (Express)   — port 3000 (internal proxy)
#    3. MungkhudShop (Nginx)   — port 8091 (public)
#    4. Portal (Nginx)     — port 8092 (public)
#
#  Usage:
#    Start:  docker compose up -d --build
#    Stop:   docker compose down
#    Logs:   docker compose logs -f
# ═══════════════════════════════════════════════════════════════

services:

  # ─── NocoDB (API + Built-in SQLite) ───
  nocodb:
    image: nocodb/nocodb:latest
    container_name: bc-nocodb
    restart: always
    environment:
      NC_AUTH_JWT_SECRET: bcauto_jwt_secret_prod_secure
      NC_PUBLIC_URL: "http://localhost:8080"
      NC_DISABLE_TELE: "true"
    # Port mapping removed to keep DB internal only (accessed via API proxy)
    volumes:
      - nocodb-data:/usr/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bc-net

  # ─── API Server (Express middleware) ───
  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: bc-api
    restart: always
    environment:
      NOCODB_URL: "${NOCODB_URL:-https://nocodb.bcauto.work}"
      NOCODB_BASE_TITLE: "${NOCODB_BASE_TITLE:-BC_ERP_testing}"
      NOCODB_TOKEN: "${NOCODB_TOKEN:?Set NOCODB_TOKEN}"
      JWT_SECRET: "bcauto_jwt_secret_2026_change_in_production"
      PORT: "3000"
    # Port mapping removed, accessed via Nginx proxies
    depends_on:
      nocodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bc-net

  # ─── MungkhudShop Frontend ───
  mungkhudshop:
    image: nginx:alpine
    container_name: bc-mungkhud
    restart: always
    volumes:
      - ./MungkhudShop/dist:/usr/share/nginx/html:ro
      - ./nginx-mungkhud.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"
    depends_on:
      api-server:
        condition: service_healthy
    networks:
      - bc-net

  # ─── Portal Frontend ───
  portal:
    image: nginx:alpine
    container_name: bc-portal
    restart: always
    volumes:
      - ./Portal/dist:/usr/share/nginx/html:ro
      - ./nginx-portal.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8092:80"
    depends_on:
      api-server:
        condition: service_healthy
    networks:
      - bc-net

networks:
  bc-net:
    driver: bridge

volumes:
  nocodb-data:
    name: bcauto-nocodb-data
    external: false
