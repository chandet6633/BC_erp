# ═══════════════════════════════════════════════════════════════
#  BC AUTO XPERIENCE — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════════
#  Two services sharing the same PocketBase architecture:
#    - Management   (port 8092) — Back-office analytics & operations
#    - MungkhudShop (port 8091) — Front-office shop ERP
#
#  UPDATE: Push to `main` → GitHub Actions builds images →
#  On this PC, run update.bat to pull & restart.
#
#  IMPORTANT: Database files live in Docker named volumes.
#  Rebuilding/updating containers will NEVER touch your data.
#
#  Quick commands:
#    Start:   docker compose up -d
#    Stop:    docker compose down
#    Update:  .\update.bat
#    Logs:    docker compose logs -f
# ═══════════════════════════════════════════════════════════════

services:

  # ─── Back-Office: Revenue, P&L, HR, Audit ───
  management:
    image: ghcr.io/chandet6633/bc_erp-management:latest
    container_name: bc-management
    ports:
      - "8092:8092"
    volumes:
      - erp-management-data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8092/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - erp-net

  # ─── Front-Office: Jobs, Inventory, Documents, Purchasing ───
  mungkhudshop:
    image: ghcr.io/chandet6633/bc_erp-mungkhud:latest
    container_name: bc-mungkhud
    ports:
      - "8091:8091"
    volumes:
      - erp-mungkhud-data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - erp-net

# ─── Networking ───
networks:
  erp-net:
    driver: bridge

# ─── Data Persistence ───
# Database files are stored in Docker named volumes:
#   - erp-management-data → Management database
#   - erp-mungkhud-data   → MungkhudShop database
# These persist across container rebuilds.
volumes:
  erp-management-data:
    name: erp-management-data
    external: true
  erp-mungkhud-data:
    name: erp-mungkhud-data
    external: true
