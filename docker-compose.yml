# ═══════════════════════════════════════════════════════════════
#  BC AUTO XPERIENCE — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════════
#
#  Two services sharing the same PocketBase architecture:
#    - Management   (port 8092) — Back-office analytics & operations
#    - MungkhudShop (port 8091) — Front-office shop ERP
#
#  IMPORTANT: Database files live in named Docker volumes.
#  Rebuilding/updating containers will NEVER touch your data.
#  Only `docker volume rm` can delete the volumes.
#
#  Quick commands:
#    Start:  docker compose up -d
#    Stop:   docker compose down
#    Update: .\update_production.bat
#    Logs:   docker compose logs -f
# ═══════════════════════════════════════════════════════════════

services:

  # ─── Back-Office: Revenue, P&L, HR, Audit ───
  management:
    build:
      context: ./Management
      dockerfile: Dockerfile
    container_name: bc-management
    ports:
      - "8092:8092"
    volumes:
      - ./Management/pb_data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8092/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - erp-net

  # ─── Front-Office: Jobs, Inventory, Documents, Purchasing ───
  mungkhudshop:
    build:
      context: ./MungkhudShop
      dockerfile: Dockerfile
    container_name: bc-mungkhud
    ports:
      - "8091:8091"
    volumes:
      - ./MungkhudShop/pb_data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - erp-net

# ─── Networking ───
networks:
  erp-net:
    driver: bridge

# ─── Data Persistence ───
# Database files are stored in local pb_data/ directories:
#   - ./Management/pb_data/   → Management database
#   - ./MungkhudShop/pb_data/ → MungkhudShop database
# These persist across container rebuilds as they live on the host filesystem.
