# ═══════════════════════════════════════════════════════════════
#  BC AUTO XPERIENCE — Docker Compose (TEST Environment)
# ═══════════════════════════════════════════════════════════════
#
#  Isolated test environment on different ports:
#    - Portal   (port 9092) — Test back-office
#    - MungkhudShop (port 9091) — Test shop ERP
#
#  Uses separate pb_data_test/ directories so production data
#  is NEVER touched.
#
#  Usage:
#    Build & Start:  docker compose -f docker-compose.test.yml up -d --build
#    Stop:           docker compose -f docker-compose.test.yml down
#    Logs:           docker compose -f docker-compose.test.yml logs -f
# ═══════════════════════════════════════════════════════════════

services:

  # ─── Test: Back-Office ───
  management-test:
    build:
      context: ./Portal
      dockerfile: Dockerfile
    container_name: bc-portal-test
    ports:
      - "9092:8092"
    volumes:
      - ./Portal/pb_data_test:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8092/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Test: Front-Office ───
  mungkhudshop-test:
    build:
      context: ./MungkhudShop
      dockerfile: Dockerfile
    container_name: bc-mungkhud-test
    ports:
      - "9091:8091"
    volumes:
      - ./MungkhudShop/pb_data_test:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
