<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BC AutoXperience — Test Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
.topbar{background:linear-gradient(135deg,#1e3a5f,#1e40af);color:#fff;padding:20px 24px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.topbar h1{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.topbar .meta{display:flex;gap:16px;font-size:.8rem;opacity:.85;flex-wrap:wrap}
.progress-wrap{background:rgba(255,255,255,.15);border-radius:99px;height:10px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#22c55e);transition:width .4s}
.progress-text{font-size:.75rem;margin-top:4px;opacity:.8}
.container{max-width:900px;margin:0 auto;padding:16px}
.phase{background:#fff;border-radius:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #e2e8f0;overflow:hidden}
.phase-header{padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none;transition:background .15s}
.phase-header:hover{background:#f8fafc}
.phase-header .arrow{transition:transform .2s;font-size:.8rem;color:#94a3b8}
.phase-header.open .arrow{transform:rotate(90deg)}
.phase-header .title{flex:1;font-weight:700;font-size:.95rem}
.phase-header .badge{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge-done{background:#dcfce7;color:#166534}.badge-partial{background:#fef9c3;color:#854d0e}.badge-none{background:#f1f5f9;color:#64748b}
.phase-body{display:none;padding:0 20px 16px;border-top:1px solid #f1f5f9}
.phase-body.open{display:block}
.section-title{font-size:.8rem;font-weight:700;color:#64748b;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.note-area{width:100%;min-height:60px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;font-size:.8rem;font-family:inherit;resize:vertical;margin:8px 0 12px;transition:border-color .2s}
.note-area:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.note-area::placeholder{color:#94a3b8}
.item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:.85rem;line-height:1.5}
.item:last-child{border-bottom:none}
.item input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:#22c55e;cursor:pointer;flex-shrink:0}
.item label{cursor:pointer;flex:1}
.item.checked label{color:#94a3b8;text-decoration:line-through}
.item .num{color:#94a3b8;font-size:.75rem;font-weight:600;min-width:28px;flex-shrink:0}
.actions{display:flex;gap:8px;margin:16px 0}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.btn-danger:hover{background:#fee2e2}
.btn-ghost{background:#f1f5f9;color:#475569}.btn-ghost:hover{background:#e2e8f0}
.test-accounts{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:16px;margin:16px 0;font-size:.8rem}
.test-accounts h4{margin-bottom:8px;color:#92400e}
.test-accounts table{width:100%;border-collapse:collapse;font-size:.78rem}
.test-accounts th,.test-accounts td{padding:4px 8px;text-align:left;border-bottom:1px solid #fef3c7}
.test-accounts th{color:#92400e;font-weight:600}
.prereq{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:.82rem;color:#1e40af}
.prereq strong{font-weight:700}
code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:.78rem;font-family:'SF Mono',monospace}
@media(max-width:640px){.container{padding:10px}.phase-header .title{font-size:.85rem}}
</style>
</head>
<body>
<div class="topbar">
  <h1>🧪 BC AutoXperience — Test Checklist</h1>
  <div class="meta"><span id="statChecked">0</span>/<span id="statTotal">0</span> items &bull; <span id="statPct">0%</span> complete</div>
  <div class="progress-wrap"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
  <div class="progress-text" id="progressText">Click each phase to expand</div>
</div>
<div class="container" id="app"></div>

<script>

]},

{title:"6.2 MungkhudShop",items:["500px: hamburger appears","Hamburger → sidebar slides","Mobile navigation works","768px: 2-col stats","480px: 1-col stats","Tap card → scale animation"]},
{title:"6.3 Kanban Touch",items:["Long-press → floating clone","Drag to column → blue border","Release → card moves"]},
{title:"6.4 Notifications",items:["≤768px: bottom sheet","Internal scroll only","Click outside → closes"]},

]},

{title:"7.2 Skeleton",items:["Slow 3G → shimmer visible"]},
{title:"7.3 Accessibility",items:["Tab through login → gold outline","Tool cards have aria-label","Pinch-to-zoom works","iPhone notch safe"]}
]},

{title:"8.1 API Endpoints",items:[
"/auth/login correct → 200 + token","/auth/login wrong → 401","/auth/me valid → 200","/auth/me invalid → 401","/auth/pin-login → 200","6 rapid fails → 429"
]},
{title:"8.2 Go/No-Go",items:[
"Auth: all 3 methods work","CRUD on key tables","Inventory IN/OUT/ADJ","Finance: totals + VAT correct","Branch isolation works","Reports render","Audit logging works","Mobile responsive","Dark mode","Smooth transitions","NocoDB accessible"
]}
]},

{title:"9.1 API Financial Restrictions",items:[
"owner → GET jobs → 200","owner → GET audit_logs → 200","owner → GET system_settings → 403","admin → GET system_settings → 200","sa → GET transactions → 403","mechanic → GET financial_entries → 403","mechanic → GET jobs → 200 (branch-scoped)"
]},
{title:"9.2 Frontend Route Guard",items:[
"mechanic → /dashboard → access denied","mechanic → /admin → access denied","sa → /dashboard → access denied","owner → /dashboard → loads OK","admin → /admin → loads OK","← กลับ on denied → main portal"
]},
{title:"9.3 KPI Revenue Visibility",items:[
"owner → 3 KPIs including revenue","manager → 3 KPIs including revenue","sa → 2 KPIs, NO revenue","mechanic → 2 KPIs, NO revenue"
]}
]},
{phase:"Phase 10: Financial System + HR Redesign",sections:[
{title:"10.1 NocoDB Table",items:["financial_ledger table exists with all columns"]},
{title:"10.2 Expense Input",items:[
"Owner → 'บันทึกรายจ่าย' visible in main menu","Add expense (ค่าไฟ, 1500฿) → appears in history","Add 'เจ้าของเบิก' → shows owner badge","Edit expense → verify updated","Delete expense → verify removed","Filter by category + date → totals update","Mechanic → page NOT accessible"
]},
{title:"10.3 Financial Dashboard",items:[
"Owner → 4 KPI cards render","Month/year selector changes data","ภาพรวม: charts + P&L + Break-Even + branch","เทรนด์: monthly bars + margin line","เชิงลึก: peak hours + days + top customers","วิเคราะห์สินค้า: star products + labor/parts","Recent jobs table renders","Mechanic → dashboard NOT accessible"
]},
{title:"10.4 HR System",items:[
"HR menu → 3 links render","HR Dashboard → KPIs + charts + tables","Payroll → month selector + employee breakdown","Check-in page still works"
]},
{title:"10.5 Cleanup",items:[
"No dead links in any menu","Operations menu: audit, entry, verification only","employee-entry.html → 404","branch-operations/dashboard.html → 404","hr/migrate.html → 404","npm run build → no errors"
]}
]},
{phase:"Phase 11: Per-Role Tool Visibility",sections:[
{title:"11.1 Owner (PIN: 280612)",items:[
"Owner → แดชบอร์ดสรุป ✅ visible","Owner → ฐานข้อมูล ✅ visible","Owner → บันทึกรายจ่าย ✅ visible","Owner → จัดการรายการ ✅ visible","Owner → BC Tool ✅ visible","Owner → ระบบจัดการร้าน ✅ visible","Owner → เข้า-ออกงาน ✅ visible","Owner → HR Dashboard ✅ visible","Owner → รายรับวันนี้ KPI ✅ visible"
]},
{title:"11.2 Manager (PIN: 111111)",items:[
"Manager → แดชบอร์ดสรุป ✅ visible","Manager → ฐานข้อมูล ✅ visible","Manager → บันทึกรายจ่าย ✅ visible","Manager → จัดการรายการ ✅ visible","Manager → BC Tool ✅ visible (samchuk)","Manager → ระบบจัดการร้าน ✅ visible","Manager → HR Dashboard ✅ visible","Manager → ตั้งค่าระบบ ❌ hidden","Manager → รายรับวันนี้ KPI ✅ visible"
]},
{title:"11.3 SA (PIN: 222222)",items:[
"SA → แดชบอร์ดสรุป ❌ hidden","SA → ฐานข้อมูล ❌ hidden","SA → บันทึกรายจ่าย ❌ hidden","SA → จัดการรายการ ✅ visible","SA → BC Tool ✅ visible (samchuk)","SA → ระบบจัดการร้าน ✅ visible","SA → เข้า-ออกงาน ✅ visible","SA → HR Dashboard ❌ hidden","SA → ตั้งค่าระบบ ❌ hidden","SA → รายรับวันนี้ KPI ❌ hidden"
]},
{title:"11.4 Mechanic (PIN: 333333)",items:[
"Mechanic → แดชบอร์ดสรุป ❌ hidden","Mechanic → ฐานข้อมูล ❌ hidden","Mechanic → บันทึกรายจ่าย ❌ hidden","Mechanic → จัดการรายการ ❌ hidden","Mechanic → BC Tool ❌ hidden","Mechanic → ระบบจัดการร้าน ❌ hidden","Mechanic → เข้า-ออกงาน ✅ visible","Mechanic → HR Dashboard ❌ hidden","Mechanic → ตั้งค่าระบบ ❌ hidden","Mechanic → รายรับวันนี้ KPI ❌ hidden"
]},
{title:"11.5 Admin (Password: 123456)",items:[
"Admin → แดชบอร์ดสรุป ✅ visible","Admin → ตั้งค่าระบบ ✅ visible (admin only)","Admin → All other tools ✅ visible"
]}
]}
];

const STORAGE_KEY='bcauto_checklist_v2';
let state=load();

function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return {}}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function itemKey(pi,si,ii){return `${pi}_${si}_${ii}`}
function noteKey(pi){return `note_${pi}`}

function render(){
const app=document.getElementById('app');
let totalItems=0,checkedItems=0;
DATA.forEach((p,pi)=>{p.sections.forEach((s,si)=>{s.items.forEach((_,ii)=>{totalItems++;if(state[itemKey(pi,si,ii)])checkedItems++})})});

document.getElementById('statChecked').textContent=checkedItems;
document.getElementById('statTotal').textContent=totalItems;
const pctVal=totalItems>0?Math.round(checkedItems/totalItems*100):0;
document.getElementById('statPct').textContent=pctVal+'%';
document.getElementById('progressBar').style.width=pctVal+'%';
document.getElementById('progressText').textContent=checkedItems===totalItems&&totalItems>0?'🎉 All tests passed!':'';

let html='';
html+=`<div class="prereq"><strong>Prerequisites:</strong> Docker Desktop running, <code>docker compose -f docker-compose.test.nocodb.yml up -d</code><br>Management: <a href="http://localhost:9092" target="_blank">:9092</a> &bull; MungkhudShop: <a href="http://localhost:9091" target="_blank">:9091</a> &bull; NocoDB: <a href="http://localhost:9080" target="_blank">:9080</a> &bull; API: <a href="http://localhost:9093/api/health" target="_blank">:9093</a></div>`;

html+=`<div class="test-accounts"><h4>🔑 Test Accounts</h4><table><tr><th>User</th><th>Password</th><th>PIN</th><th>Role</th><th>Login Method</th></tr><tr><td>admin</td><td>123456</td><td>000000</td><td>admin</td><td>Username</td></tr><tr><td>owner</td><td>280612</td><td>280612</td><td>owner</td><td>Username</td></tr><tr><td>manager1</td><td>—</td><td>111111</td><td>manager</td><td>PIN only</td></tr><tr><td>sa</td><td>—</td><td>222222</td><td>sa</td><td>PIN only</td></tr><tr><td>somchai</td><td>—</td><td>333333</td><td>mechanic</td><td>PIN only</td></tr></table></div>`;
html+=`<div class="test-accounts" style="background:#eff6ff;border-color:#bfdbfe;"><h4 style="color:#1e40af;">🗄️ NocoDB Admin</h4><table><tr><th>URL</th><th>Email</th><th>Password</th><th>API Token</th></tr><tr><td><a href="http://localhost:9080" target="_blank">localhost:9080</a></td><td>admin@bcauto.work</td><td>BcAuto2026!</td><td style="font-size:.7rem;word-break:break-all;">UmqurJUh0NhbrQWnhMJ-sXRgA6wfrlX4dvk9Y5YD</td></tr></table></div>`;

let globalIdx=0;
DATA.forEach((p,pi)=>{
  let phaseTotal=0,phaseChecked=0;
  p.sections.forEach((s,si)=>s.items.forEach((_,ii)=>{phaseTotal++;if(state[itemKey(pi,si,ii)])phaseChecked++}));
  const badgeClass=phaseChecked===phaseTotal&&phaseTotal>0?'badge-done':phaseChecked>0?'badge-partial':'badge-none';
  const badgeText=`${phaseChecked}/${phaseTotal}`;
  const isOpen=state[`open_${pi}`]?'open':'';
  const noteVal=state[noteKey(pi)]||'';
  html+=`<div class="phase"><div class="phase-header ${isOpen}" onclick="togglePhase(${pi})"><span class="arrow">▶</span><span class="title">${p.phase}</span><span class="badge ${badgeClass}">${badgeText}</span></div><div class="phase-body ${isOpen}">`;
  html+=`<textarea class="note-area" placeholder="📝 Notes for ${p.phase}..." oninput="saveNote(${pi},this.value)">${noteVal}</textarea>`;
  p.sections.forEach((s,si)=>{
    html+=`<div class="section-title">${s.title}</div>`;
    s.items.forEach((item,ii)=>{
      globalIdx++;
      const k=itemKey(pi,si,ii);
      const checked=state[k]?'checked':'';
      html+=`<div class="item ${checked}"><span class="num">#${globalIdx}</span><input type="checkbox" id="cb_${k}" ${checked?'checked':''} onchange="toggle('${k}',this.checked)"><label for="cb_${k}">${item}</label></div>`;
    });
  });
  html+=`</div></div>`;
});

html+=`<div class="actions"><button class="btn btn-ghost" onclick="expandAll()">📂 Expand All</button><button class="btn btn-ghost" onclick="collapseAll()">📁 Collapse All</button><button class="btn btn-danger" onclick="resetAll()">🗑 Reset All</button></div>`;
app.innerHTML=html;
}

window.toggle=function(k,v){state[k]=v;save();render()};
window.saveNote=function(pi,v){state[noteKey(pi)]=v;save()};
window.togglePhase=function(pi){state[`open_${pi}`]=!state[`open_${pi}`];save();render()};
window.expandAll=function(){DATA.forEach((_,i)=>state[`open_${i}`]=true);save();render()};
window.collapseAll=function(){DATA.forEach((_,i)=>state[`open_${i}`]=false);save();render()};
window.resetAll=function(){if(confirm('Reset all checkboxes and notes?')){state={};save();render()}};

render();
</script>
</body>
</html>
