[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/google%20script/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/google script/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dev-server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/workflow.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[functions."daily-summary"]
  schedule = "0 2 * * *"

[functions."daily-checkout"]
  schedule = "0 11 * * *"
