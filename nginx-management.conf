# ═══════════════════════════════════════════════════════════════
#  Nginx Configuration — Management Frontend
# ═══════════════════════════════════════════════════════════════
#  - Serves Vite MPA build from /usr/share/nginx/html
#  - Proxies /api/ requests to NocoDB
#  - MPA mode: serves actual HTML pages (not SPA fallback)
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip compression ───
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ─── NocoDB API Proxy ───
    location /api/ {
        proxy_pass http://bcauto-nocodb:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, xc-auth, xc-token" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ─── Static files with caching ───
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── MPA — Serve pages directly ───
    # Management uses multi-page architecture, so try the exact file first
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ─── Default entry point ───
    location = / {
        return 302 /pages/main/index.html;
    }

    # ─── Health check endpoint ───
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
