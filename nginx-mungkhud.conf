# ═══════════════════════════════════════════════════════════════
#  Nginx Configuration — MungkhudShop Frontend
# ═══════════════════════════════════════════════════════════════
#  - Serves Vite SPA build from /usr/share/nginx/html
#  - Proxies /api/ requests to NocoDB
#  - SPA fallback: all unknown routes → index.html
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip compression ───
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ─── NocoDB API Proxy ───
    # All /api/ requests are proxied to NocoDB backend
    location /api/ {
        proxy_pass http://bcauto-nocodb:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large queries
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # CORS headers (NocoDB may handle this, but just in case)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, xc-auth, xc-token" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ─── Static files with caching ───
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── SPA Fallback ───
    # Hash-based routing (#/dashboard, #/job, etc.) doesn't need server fallback,
    # but this covers any direct URL access or bookmarks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Health check endpoint ───
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
